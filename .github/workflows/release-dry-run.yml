# Martha's release, rehearsed without a tag (martha#21, design section 5 step 1).
#
# This exists so the first v<X.Y.Z> tag is not the first time the pipeline runs. Started by hand on any branch:
#
#   gh workflow run release-dry-run.yml --ref <branch>
#
# It packs the tree, pushes one image into the release package under a dry-run tag (<dryRunTagPrefix><run>-<attempt>,
# never a version, so no install ever takes it) and an unsigned image beside it, signs the first through
# attest-image.yml at the sha release.yml calls (its guard passes a ref that is no tag), and then rehearses the
# install against the real Sigstore trust root:
#   - the signature verifies for THIS branch's ref, by a listed signer, for this repository;
#   - the same signature is refused for refs/tags/v<version>, the ref every real install demands;
#   - the unsigned digest is refused;
#   - the signed layer unpacks to exactly the committed tree.
# The ref check only ever runs against a branch ref here, from installer/rehearse_a_release/, a script the npm
# package does not ship: the installer itself has no way to name another ref.
#
# Like the release, it waits on the dependency advisory scan (advisories.yml, martha#110).
#
# What it cannot rehearse: the guard on a v* tag and the published-once check; those run on the tag only.
#
# It packs through pack_a_release.sh, so like a release it pins the installer (martha#84) and needs the installer
# version this tree carries to be published on npm AND tagged here (installer-v<version>, #21's order: installer
# tag first). A dry run before that publish refuses, in words, and pushes nothing.
#
# The first dry run is also what makes the release package: the owner links it to this repository and makes it
# public after that run and before the first release tag (design section 5).

name: release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The release waits on the advisory scan (martha#110), so its rehearsal does too: nothing is pushed or signed while a
  # dependency carries a known published advisory.
  advisories:
    permissions:
      contents: read
    uses: ./.github/workflows/advisories.yml

  push:
    needs: advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      unsigned: ${{ steps.push.outputs.unsigned }}
      image: ${{ steps.names.outputs.image }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner context is not allowed in a job-level env, so the build context is named here, once, for the
      # steps after it.
      - name: The build context
        run: echo "RELEASE_CTX=$RUNNER_TEMP/dry-run-ctx-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: The names
        id: names
        run: |
          {
            echo "image=$(jq -r .martha.image installer/package.json)"
            echo "version=$(jq -r .version package.json)"
            echo "tag=$(jq -r .martha.dryRunTagPrefix installer/package.json)${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The pin is made from npm's provenance (martha#84): the installer's own sigstore checks the bundle, and the
      # tag that version's publish ran at is what the attestation's commit must name.
      - name: The tag the installer's publish ran at
        run: |
          set -euo pipefail
          version="$(jq -r .version installer/package.json)"
          tag="$(jq -r .martha.installerTagPrefix installer/package.json)${version}"
          git fetch --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git rev-parse --verify "refs/tags/${tag}^{commit}"
      - name: The installer's own dependencies (its sigstore checks the pin)
        working-directory: installer
        run: npm ci --omit=dev --ignore-scripts
      # A docker-container builder: the default docker driver ignores oci-mediatypes and pushes a Docker v2
      # manifest, which every install refuses.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pack the tree
        run: pack_a_release/pack_a_release.sh "${{ steps.names.outputs.version }}" "$RELEASE_CTX"
      - name: Push the image, and an unsigned one beside it
        id: push
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set -euo pipefail
          # As release.yml: built to a local OCI layout, checked there before anything reaches the registry, then
          # that same layout pushed unchanged and the pushed digest compared with the checked one. Rehearsing that
          # order is the point of running it here. Called as a statement, never inside $( ), so set -e holds in it;
          # each command that can fail names itself. The checked digest is left in $built.
          build() {
            local layout="$RUNNER_TEMP/layout-$1" checked type
            docker buildx build -f "$RELEASE_CTX/Containerfile" --provenance=false --sbom=false "${@:2}" \
              --output "type=oci,dest=$layout,tar=false,oci-mediatypes=true,compression=gzip" "$RELEASE_CTX" \
              || { echo "::error::docker buildx build failed for $1; nothing was pushed" >&2; exit 1; }
            [ "$(jq '.manifests | length' "$layout/index.json")" = 1 ] || { echo "::error::the build of $1 made more than one manifest; nothing was pushed" >&2; exit 1; }
            checked="$(jq -r '.manifests[0].digest' "$layout/index.json")"
            [[ "$checked" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build of $1; nothing was pushed" >&2; exit 1; }
            type="$(jq -r .mediaType "$layout/blobs/sha256/${checked#sha256:}")"
            [ "$type" = application/vnd.oci.image.manifest.v1+json ] || { echo "::error::the build of $1 made a $type, not one image manifest; nothing was pushed" >&2; exit 1; }
            skopeo copy --preserve-digests --digestfile "$layout.digest" "oci:$layout" "docker://$IMAGE:$1" \
              || { echo "::error::skopeo copy failed for $1" >&2; exit 1; }
            [ "$(cat "$layout.digest")" = "$checked" ] || { echo "::error::$IMAGE:$1 was pushed as $(cat "$layout.digest"), not the checked $checked" >&2; exit 1; }
            built="$checked"
          }
          build "$TAG"
          digest="$built"
          build "$TAG-unsigned" --label dev.macula.dry-run=unsigned
          unsigned="$built"
          [ "$unsigned" != "$digest" ] || { echo "::error::the unsigned image is not a second digest"; exit 1; }
          for pushed in "$digest" "$unsigned"; do
            # A second guard, on what the registry now serves.
            served="$(docker buildx imagetools inspect --raw "$IMAGE@$pushed" | jq -r .mediaType)"
            [ "$served" = application/vnd.oci.image.manifest.v1+json ] || { echo "::error::$IMAGE@$pushed is served as a $served"; exit 1; }
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"

  sign:
    needs: push
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    with:
      image: ${{ needs.push.outputs.image }}
      digest: ${{ needs.push.outputs.digest }}
      version-root: .

  rehearse:
    needs: [push, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: installer
      - name: Verify for this branch, refuse for the tag, refuse the unsigned, compare the tree
        env:
          DRY_RUN_IMAGE: ${{ needs.push.outputs.image }}
          DRY_RUN_VERSION: ${{ needs.push.outputs.version }}
          DRY_RUN_DIGEST: ${{ needs.push.outputs.digest }}
          DRY_RUN_UNSIGNED_DIGEST: ${{ needs.push.outputs.unsigned }}
          DRY_RUN_REF: ${{ github.ref }}
          GHCR_TOKEN: ${{ github.token }}
        run: node installer/rehearse_a_release/rehearse_a_release.mjs
