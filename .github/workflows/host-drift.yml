# Host drift (martha#139): the committed recording of the Claude Code host still says what the version members run,
# npm's `latest` release, says. Any fact that differs fails, naming the field. A release whose facts are all the
# recorded ones once the minifier's names are taken out passes on its version alone, with a notice (a run annotation
# and a job summary line) that a routine re-record is due; the notice fails after 7 days or at the 5th newer release
# (martha#811).
#
# When it runs: daily, by hand, on every push to main, and on PRs that touch the recording, its readers or this
# check. Not on every PR: a release is an event in nobody's change, and it must not turn every open PR red. A PR that
# touches src/claude_code_host/** for another reason will go red the day a release lands; that is meant, since a
# change to a reader is proven on the host members run. THE FIX IS A RE-RECORD, NOT A RETRY:
#   npm run record:claude-code-host -- <claude binary> <version>
# then a PR with whatever the named fields call for. prove_the_recorded_host_is_current.sh says how.
#
# The job also measures the order the host raises its dialog events in, on the host it just installed (martha#313): the
# owner's row closes on a call's answer because nothing else arrives between the owner's answer and the run, and a
# release is what can change that. So a new host fails here, naming the pair, rather than in a member's row.
#
# The job also re-takes the `Bash` answers recording, a live observation of the host (martha#193, martha#812): first on
# the release the recording is of, to prove the harness on a known host, then on the host it just installed. Those
# steps run even when the recording check above fails, since a new release is exactly when it fails and exactly when
# the re-recorder needs the answers. The harness never rewrites the recording: a re-record stays a PR, and
# claude_code_host.node-test.ts fails, naming both versions, until the two recordings name one host.
#
# A green run with a notice is the signal a re-record is due; the Supervisor routes it as a package. A failed
# scheduled or main run stays red, and that is the whole signal: it names the versions and the fields that
# differ, and the Supervisor routes the re-record. The job opens no issue and writes nothing: its token is read-only.
#
# That the check can fail at all is proven on every PR, with no npm, by ci.yml's `drift-bites` job.

name: host drift

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/claude_code_host/**'
      - 'src/record_claude_code_host/**'
      - 'prove_the_recorded_host_is_current/**'
      - 'prove_the_relay_loads/prove_the_order_of_the_dialogs.mjs'
      - 'prove_the_relay_loads/prove_the_bash_answers/prove_the_bash_answers.mjs'
      - 'prove_the_relay_loads/the_wait_a_probe_gives_a_screen.mjs'
      - 'prove_the_relay_loads/prove_the_bash_answers/the_recorded_host_installed.sh'
      - '.github/workflows/host-drift.yml'

permissions:
  contents: read

jobs:
  drift:
    name: the recording is of the host members run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: the recording matches npm's latest Claude Code
        run: prove_the_recorded_host_is_current/prove_the_recorded_host_is_current.sh "${{ runner.temp }}/host-drift" "${{ runner.temp }}/the-host"
      # The owner's row says "needs you" until the call its dialog raised is answered, and that rests on the order the
      # host raises its events in, measured on the host itself (martha#313). A new release is the one thing that can
      # change that order, so it is measured here, on the host the step above installed.
      - name: the order the host raises its dialog events in
        run: MARTHA_RECORDED_HOST="${{ runner.temp }}/the-host/node_modules/.bin/claude" node prove_the_relay_loads/prove_the_order_of_the_dialogs.mjs "${{ runner.temp }}/dialog-order"
      # The Bash answers (martha#812): what the host answers a tool.call hook for the commands the recording holds, one
      # run of the host per case, through a scratch plugin. Proven first on a known host — the release the recording is
      # of, installed beside latest — and only then taken on this release, whose answers are the ones that count. A run
      # that cannot take a case exits 2 naming it, so a green step means every case was taken. They run even when the
      # recording check failed: a new release fails it on its version alone, and its answers are what the re-record needs.
      - name: the recorded release, to prove the harness on a known host
        if: ${{ !cancelled() }}
        run: prove_the_relay_loads/prove_the_bash_answers/the_recorded_host_installed.sh "${{ runner.temp }}/the-recorded-host"
      - name: the Bash answers on the recorded release (the control)
        if: ${{ !cancelled() }}
        run: MARTHA_RECORDED_HOST="${{ runner.temp }}/the-recorded-host/node_modules/.bin/claude" node prove_the_relay_loads/prove_the_bash_answers/prove_the_bash_answers.mjs "${{ runner.temp }}/bash-answers-control"
      - name: the Bash answers on this release
        if: ${{ !cancelled() }}
        run: MARTHA_RECORDED_HOST="${{ runner.temp }}/the-host/node_modules/.bin/claude" node prove_the_relay_loads/prove_the_bash_answers/prove_the_bash_answers.mjs "${{ runner.temp }}/bash-answers"
