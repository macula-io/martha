name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The wordmark must stay well-formed SVG, or GitHub shows a broken image.
  #
  # The parse runs this repository's own Node code on the Node the other jobs pin
  # (martha#271). It used to be xmllint, installed from the Ubuntu archive through
  # apt; on 2026-11-11 a hosted runner could not resolve archive.ubuntu.com, and
  # this job went red in the install with nothing of this repository run. The
  # planted logo below holds the check to the other half: an SVG a browser shows
  # as a broken image still goes red here, by name.
  logos:
    name: logos are valid SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: plant a broken logo
        run: |
          mkdir -p "${{ runner.temp }}/logos-self-test"
          printf '<svg xmlns="http://www.w3.org/2000/svg"><g></svg>\n' > "${{ runner.temp }}/logos-self-test/broken-logo.svg"
      - name: the check bites
        # Exit 1 (refused) is required, not any non-zero: exit 2 is "could not
        # look", which must never read as a bite either.
        run: |
          status=0
          npm run --silent check:logos -- "${{ runner.temp }}"/logos-self-test/*.svg \
            > "${{ runner.temp }}/logos-self-test/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            cat "${{ runner.temp }}/logos-self-test/verdict.txt"
            exit 1
          fi
          grep -q broken-logo.svg "${{ runner.temp }}/logos-self-test/verdict.txt"
      - name: the logos are valid SVG
        run: npm run --silent check:logos -- assets/*.svg

  # Every link in every document resolves, relative ones included. A host that
  # answers slowly is retried before its link is called broken; the badge URLs
  # are scanned like any other link, so a renamed workflow still fails here.
  #
  # Two kinds of slowness, two retries. lychee's own `--max-retries` covers a
  # request that TIMED OUT. It does not cover a host that answers 408/429/5xx:
  # once a response is a RejectedStatusCode, lychee 0.24.2 retries 429 alone, so
  # a 408 from shields.io failed this job in 10.7 s with no retry made
  # (martha#231, after martha#40). `check_every_link_resolves` therefore repeats
  # a run that failed only on those statuses, and fails at once -- by name -- on
  # a failure no host recovers from, a 404 or a file that is not there. The
  # planted dead link is held to both halves: lychee must refuse it, and so must
  # the command the scan actually runs.
  links:
    name: links resolve
    runs-on: ubuntu-latest
    env:
      # Retry and timeout options, defined once and used by both runs below.
      # A timeout is retried, and the wait doubles: five tries of 30 s with
      # 3 s, 6 s, 12 s and 24 s between them, so a link that is really gone
      # fails within about 3 min 15 s and a slow host has all that time to
      # answer.
      LYCHEE_OPTIONS: '--no-progress --include-fragments --max-retries 4 --retry-wait-time 3 --timeout 30'
    steps:
      - uses: actions/checkout@v7
      # This job runs this repository's own Node code now (check_every_link_resolves),
      # so it runs on the Node the other Node jobs pin rather than on whatever the
      # runner image happens to ship. No npm ci: the check imports nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The self-test plants a link to a file that is not there, outside the
      # checkout so the scan below never sees it, and holds the same options to
      # it: the job must still go red, and name that link when it does.
      - name: plant a dead link
        run: |
          mkdir -p "${{ runner.temp }}/links-self-test"
          printf '[a page that is not there](missing-page.md)\n' > "${{ runner.temp }}/links-self-test/dead-link.md"
      - name: the check bites
        id: self_test
        # Pinned like every other action here. It also puts the pinned lychee on
        # PATH for this job, which is the checker the scan below runs, so the two
        # steps can never disagree about which lychee they mean.
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: ${{ env.LYCHEE_OPTIONS }} '${{ runner.temp }}/links-self-test/*.md'
          fail: false
          output: ${{ runner.temp }}/links-self-test/report.md
          jobSummary: false
      - name: the dead link was refused
        env:
          EXIT_CODE: ${{ steps.self_test.outputs.exit_code }}
        # The three tests share one && chain on purpose: a bare `test -n ...`
        # line would not fail the step on an empty value, because bash's -e
        # exempts a non-final command in an && list, and the grep below would
        # then pass on its own.
        run: |
          test -n "$EXIT_CODE" \
            && test "$EXIT_CODE" -ne 0 \
            && grep -q missing-page.md "${{ runner.temp }}/links-self-test/report.md"
      - name: the check below refuses it too, and names it
        # lychee refusing the dead link is not enough: the scan below is this
        # command, and a verdict that passed a dead link would be a check that
        # cannot fail. Exit 1 (refused) is required, not any non-zero: exit 2 is
        # "could not look", which must never read as a bite either.
        run: |
          status=0
          npm run --silent check:links -- '${{ runner.temp }}/links-self-test/*.md' \
            > "${{ runner.temp }}/links-self-test/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            cat "${{ runner.temp }}/links-self-test/verdict.txt"
            exit 1
          fi
          grep -q missing-page.md "${{ runner.temp }}/links-self-test/verdict.txt"
      - name: every link resolves
        # The check itself, and its retry of a host that said "not now". A green
        # here means every link was seen to resolve; a red names the links.
        run: npm run --silent check:links -- '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The publish gate (issue #2): no outsider's text reaches a shell-holding
  # member without a control, and a path added without one fails here by name.
  # The unit tests plant ungated paths to prove the check is not vacuous.
  gate:
    name: gate coverage
    runs-on: ubuntu-latest
    # A signed run (martha#129) happens in a sandbox or not at all, so its tests
    # skip where none can be built. Here one must be: a missing sandbox fails a
    # test by name instead of skipping the gate in silence.
    env:
      MARTHA_SANDBOX_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # A checkout's .envrc is one of the doors martha#24 shuts, in two ways:
      # DIRENV_DISABLE for direnv 2.38 and later, and the DIRENV_CONFIG fallback
      # for older ones. Both kinds are proven: a 2.38 direnv for the first, and
      # the older version Ubuntu ships for the second, which has only the
      # fallback. MARTHA_TESTS_DIRENV names both, and a test fails by name when
      # either is missing, so CI never drops the door
      # (src/launch_a_claude_code_member/direnvs_under_test.ts).
      #
      # Both come from their GitHub releases rather than the Ubuntu archive: on
      # 2026-11-11 a hosted runner could not resolve archive.ubuntu.com, and this
      # job went red in the install of one of them with nothing of this
      # repository run (martha#271). github.com answers on these runners -- the
      # checkout comes from it -- and each download is held to the sha256 named
      # here, once per version and restated nowhere. Each digest is written
      # `sha256:<hex>`, the form the nothing-private check reads as a digest
      # rather than as a node id; fetch_the_direnvs.sh verifies it and runs what
      # it verified, and nothing else.
      #
      # The fetch's check is proved before it is trusted: the real download only
      # ever offers the right bytes, so the step below hands it bytes another
      # release serves under the digest this one names, and requires the run to
      # end red, naming the version, with nothing run.
      - name: the direnv fetch refuses bytes that are not the ones its digest names
        run: fetch_the_direnvs/fetch_the_direnvs.sh --self-test
      - name: the two direnvs, from their GitHub releases
        env:
          DIRENV_PINNED_VERSION: 'v2.38.2'
          DIRENV_PINNED_SHA256: 'sha256:148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247'
          DIRENV_OLDER_VERSION: 'v2.32.1'
          DIRENV_OLDER_SHA256: 'sha256:650d4698e8281a91d045aa0adc6cd45dc94e07957de5f64a8acda27cc431f634'
        run: |
          paths="$(fetch_the_direnvs/fetch_the_direnvs.sh --to "${{ runner.temp }}/direnvs" \
            --version "$DIRENV_PINNED_VERSION" --sha256 "$DIRENV_PINNED_SHA256" \
            --version "$DIRENV_OLDER_VERSION" --sha256 "$DIRENV_OLDER_SHA256")"
          echo "MARTHA_TESTS_DIRENV=$paths" >> "$GITHUB_ENV"
      # bubblewrap builds the sandbox from unprivileged user namespaces, which
      # Ubuntu 24.04 restricts through AppArmor by default; this runner lifts it.
      # It is the one package here that must come from the archive -- it is the
      # distro's own sandbox binary, with no release to fetch instead -- so it
      # goes through the retry, and the step before proves the retry both ways:
      # a blink is survived, and an archive that never comes back is red naming
      # the runner's network rather than reading as a failure of ours.
      - name: the archive install survives a blink, and names the runner when it cannot
        run: install_from_the_ubuntu_archive/install_from_the_ubuntu_archive.sh --self-test
      - name: a sandbox for signed runs
        run: |
          install_from_the_ubuntu_archive/install_from_the_ubuntu_archive.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / true && bwrap --version
      - run: npm ci
      # The unused rule (martha#171) is held by two checks, and a change runs
      # both: the compiler, here and in the installer job (noUnusedLocals and
      # noUnusedParameters in each tsconfig), names an unused import, local or
      # parameter by file, line and symbol; eslint, in the structural floor job,
      # holds the files no tsconfig includes, such as eslint.config.mjs, and the
      # catch binding the compiler never looks at.
      - run: npx tsc --noEmit
      - run: npm test
      # macOS's default TMPDIR is long and is reached through a link
      # (/var -> /private/var), martha#79. The suite runs again under that shape,
      # longer than the default, so a path built under TMPDIR with no room left
      # for a socket, or a path compared without resolving the link, fails here.
      - name: the suite under a long TMPDIR reached through a link
        env:
          PRIVATE_VAR: ${{ runner.temp }}/private/var
          LINKED_VAR: ${{ runner.temp }}/var
          MAC_SHAPED_TMP: folders/zz/abcdefghijklmnopqrstuvwxyz0123/T
        run: |
          mkdir -p "$PRIVATE_VAR/$MAC_SHAPED_TMP"
          chmod 700 "$PRIVATE_VAR/$MAC_SHAPED_TMP"
          ln -s "$PRIVATE_VAR" "$LINKED_VAR"
          TMPDIR="$LINKED_VAR/$MAC_SHAPED_TMP" npm test

  # The structural floor (martha#87): no function nests deeper than two levels,
  # branches past the complexity cap or runs past the length cap. The caps live
  # in eslint.config.mjs; npm test proves they bite (prove_the_core/
  # structure_stays_flat.node-test.ts) and this runs them over the whole tree.
  # No baseline, no continue-on-error, and no warning allowed: an eslint-disable
  # comment is ignored with a warning, so it fails here too.
  #
  # The unused rule (martha#171) also runs here, at error level, for what the
  # compiler cannot see: eslint.config.mjs itself, which belongs to no tsconfig,
  # any .js or .mjs beside the sources, and a catch binding nobody reads.
  structure:
    name: structural floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The installer is a project of its own (its own package.json, published
      # as the signed package), so the floor is run in it as well, by the same
      # eslint and the same eslint.config.mjs, which eslint finds above it.
      - name: the structural floor in the installer
        working-directory: installer
        run: ../node_modules/.bin/eslint . --max-warnings=0

  # The relay loads in the recorded host (martha#104). The host reads a hooks module before it runs it and refuses it
  # whole for a rule it holds; a refused relay runs no gate, and the relay's unit tests drive a stand-in engine that
  # holds none of those rules. This installs Claude Code at the version the adapter was recorded from (read from the
  # recording, never typed here), runs its own loader on the relay, and plants #104's line in a copy to prove it bites.
  # Then a launch with that host on an owner's terminal must leave the installed relay folder as it was (martha#117),
  # after a check that the host does write into a writable one.
  relay:
    name: the relay loads in the recorded host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: prove_the_relay_loads/prove_the_relay_loads.sh "${{ runner.temp }}/relay-loads"

  # The host drift check can fail (martha#139): the recorder's --check passes on a host that says what the recording
  # says and fails, naming the field, on one that does not. No host and no npm: the tests build their host from the
  # recording's own parts, so this runs on every PR, and only host-drift.yml's comparison depends on a release.
  drift-bites:
    name: the host drift check bites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: prove_the_recorded_host_is_current/prove_the_drift_check_bites.sh

  # Posted text (martha#265): the check that reads what members post on GitHub can fail. Its self-test
  # plants a cited path, in memory, on each of the six surfaces it reads, and a placeholder that must
  # pass, then names the surface whose reader stopped refusing. It needs no token and no network, so it
  # runs on every PR, and the daily run in posted-text.yml is never the first thing to find it broken.
  posted-text-bites:
    name: the posted text check bites
    runs-on: ubuntu-latest
    env:
      # The lab's families are a secret and are never printed. A pull request from a fork gets none,
      # and the check then runs every other class and says which one it skipped.
      MARTHA_LAB_HOSTS: ${{ secrets.MARTHA_LAB_HOSTS }}
      MARTHA_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the check bites
        run: npm run --silent check:posted-text -- --self-test

  # The clean-install proof removes its container whatever happens (martha#69). It runs against a host given as a
  # parameter, and this job names none: the script's own stand-ins answer ssh and podman, so the cases run here are
  # the ones a runner can hold -- a passing install half, a refusal, no release, a container that would not go, and
  # an interrupted run, whose container is removed anyway. The image, the container's own answers and the installer
  # are the case's, so a change to the script's own logic fails here by the case that broke.
  clean-install:
    name: the clean-install proof removes its container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: prove_a_clean_install_in_a_throwaway_container/prove_a_clean_install_in_a_throwaway_container.sh --self-test

  # Every workflow is one GitHub accepts (martha#21 r=3): a workflow GitHub rejects
  # never runs, and the only sign is a failed run with no jobs, which nobody reads.
  # The release workflows run on a tag or by hand only, so this is where a broken
  # one is found first. actionlint is built from the commit its v1.7.12 tag names,
  # with go install checked against sum.golang.org as the pinned direnv is.
  workflows:
    name: workflows are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: actionlint over every workflow
        env:
          ACTIONLINT_MODULE: github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          GOBIN: ${{ runner.temp }}/actionlint-pinned
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
          GOINSECURE: ''
          GOFLAGS: ''
        run: |
          go install "$ACTIONLINT_MODULE"
          "$GOBIN/actionlint" -version
          "$GOBIN/actionlint" -color

  # The installer (martha#21): every refusal it makes, red first, against a local registry; the packed package run
  # from under node_modules; and the names held to their one place across the workflows, both package.json files
  # and the READMEs. The release itself (release.yml) and the dry run run on a tag and by hand only.
  installer:
    name: installer
    runs-on: ubuntu-latest
    # A last backstop, so a hang never holds a runner for GitHub's six hours
    # (martha#112). The test script itself fails a hung test and a leaking file
    # by name. Measured on 2026-11-07: the whole job took 10 to 16 s in the last
    # four green runs on main that ran it and on PR 99 (npm ci from cache, tsc,
    # npm test). Five minutes
    # leaves room for one test running to the script's --test-timeout and an
    # npm cache miss.
    timeout-minutes: 5
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: installer/npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - run: npm test

  # Nothing private gets in (docs/nothing-private-gets-in.md): no private issue
  # link, internal host name or private remote, in the tree or in any commit of
  # the range. The lab's machine families are a secret and are never printed.
  # The self-test proves the live lookup and each family bite before the scan.
  private:
    name: nothing private
    runs-on: ubuntu-latest
    env:
      MARTHA_LAB_HOSTS: ${{ secrets.MARTHA_LAB_HOSTS }}
      MARTHA_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the check bites
        run: npm run check:private -- --self-test
      - name: nothing private in the tree or the range
        run: npm run check:private -- --range "$RANGE"

  # A branch created from a newer base while the working tree still holds edits
  # made against the older one keeps the tree across the switch, so its next
  # commit carries files at their pre-base content and a test the base passed
  # vanishes with no job going red (martha#274; 2026-11-11, 8ca6eb3 dropped four
  # titles and a documented paragraph, and r=1 was the only thing that noticed).
  # This names every title the merge base holds and the tip no longer does, and
  # the check itself computes that merge base from the two shas below.
  #
  # The shas are the event's own. On a push to main whose `before` is all zeros
  # (a branch's first push) the check answers exit 2 -- it could not look --
  # which is right and must not be "fixed" into a pass.
  #
  # Both plants run the same command the live step runs, so the shas GitHub
  # passes are proven to reach the comparison: a self-test inside the program
  # would leave that unproven. The second plant reads the drop trailer's name
  # from its one definition in the check's own source, never restating it.
  base-tests:
    name: no test the base passed goes missing
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: the check bites
        # Exit 1 (refused) is required, not any non-zero: exit 2 is "could not
        # look", which must never read as a bite either.
        run: |
          repo="${{ runner.temp }}/dropped-test-self-test"
          mkdir -p "$repo/src/x"
          git -C "$repo" init -q
          git -C "$repo" config user.email planted@example.invalid
          git -C "$repo" config user.name planted
          printf '%s\n' "{\"scripts\":{\"test\":\"node --test 'src/**/*.node-test.ts'\"}}" > "$repo/package.json"
          printf "test('a title the tip will drop', () => {})\n" > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m base
          base="$(git -C "$repo" rev-parse HEAD)"
          : > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m tip
          head="$(git -C "$repo" rev-parse HEAD)"
          status=0
          npm run --silent check:base-tests -- --base "$base" --head "$head" --repository "$repo" \
            > "$repo/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then cat "$repo/verdict.txt"; exit 1; fi
          grep -q "a title the tip will drop" "$repo/verdict.txt"
      - name: a deliberate removal passes, its trailer read from its one definition
        run: |
          repo="${{ runner.temp }}/dropped-test-claimed"
          mkdir -p "$repo/src/x"
          git -C "$repo" init -q
          git -C "$repo" config user.email planted@example.invalid
          git -C "$repo" config user.name planted
          printf '%s\n' "{\"scripts\":{\"test\":\"node --test 'src/**/*.node-test.ts'\"}}" > "$repo/package.json"
          printf "test('a title this commit drops', () => {})\n" > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m base
          base="$(git -C "$repo" rev-parse HEAD)"
          : > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          trailer="$(node --input-type=module -e "import('$GITHUB_WORKSPACE/src/check_no_test_the_base_passed_goes_missing/check_no_test_the_base_passed_goes_missing.ts').then((module) => console.log(module.DROPS_TEST_TRAILER))")"
          git -C "$repo" commit -q -m "fix: drop a test" -m "$trailer: src/x/a.node-test.ts :: a title this commit drops"
          head="$(git -C "$repo" rev-parse HEAD)"
          npm run --silent check:base-tests -- --base "$base" --head "$head" --repository "$repo"
      - name: every test the base passed is still at the tip
        run: npm run --silent check:base-tests -- --base "$BASE_SHA" --head "$HEAD_SHA"
