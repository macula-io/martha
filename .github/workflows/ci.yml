name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The wordmark must stay well-formed SVG, or GitHub shows a broken image.
  logos:
    name: logos are valid SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: xmllint --noout assets/*.svg

  # Every link in every document resolves, relative ones included. A host that
  # answers slowly is retried before its link is called broken; the badge URLs
  # are scanned like any other link, so a renamed workflow still fails here.
  links:
    name: links resolve
    runs-on: ubuntu-latest
    env:
      # Retry and timeout options, defined once and used by both runs below.
      # A timeout is retried, and the wait doubles: five tries of 30 s with
      # 3 s, 6 s, 12 s and 24 s between them, so a link that is really gone
      # fails within about 3 min 15 s and a slow host has all that time to
      # answer.
      LYCHEE_OPTIONS: '--no-progress --include-fragments --max-retries 4 --retry-wait-time 3 --timeout 30'
    steps:
      - uses: actions/checkout@v7
      # The self-test plants a link to a file that is not there, outside the
      # checkout so the scan below never sees it, and holds the same options to
      # it: the job must still go red, and name that link when it does.
      - name: plant a dead link
        run: |
          mkdir -p "${{ runner.temp }}/links-self-test"
          printf '[a page that is not there](missing-page.md)\n' > "${{ runner.temp }}/links-self-test/dead-link.md"
      - name: the check bites
        id: self_test
        # The action version is anchored here and aliased below, so a hand bump
        # cannot move one step and leave the other on the old action.
        uses: &lychee_action lycheeverse/lychee-action@v2.9.0
        with:
          args: ${{ env.LYCHEE_OPTIONS }} '${{ runner.temp }}/links-self-test/*.md'
          fail: false
          output: ${{ runner.temp }}/links-self-test/report.md
          jobSummary: false
      - name: the dead link was refused
        env:
          EXIT_CODE: ${{ steps.self_test.outputs.exit_code }}
        # The three tests share one && chain on purpose: a bare `test -n ...`
        # line would not fail the step on an empty value, because bash's -e
        # exempts a non-final command in an && list, and the grep below would
        # then pass on its own.
        run: |
          test -n "$EXIT_CODE" \
            && test "$EXIT_CODE" -ne 0 \
            && grep -q missing-page.md "${{ runner.temp }}/links-self-test/report.md"
      - name: every link resolves
        uses: *lychee_action
        with:
          args: ${{ env.LYCHEE_OPTIONS }} '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The publish gate (issue #2): no outsider's text reaches a shell-holding
  # member without a control, and a path added without one fails here by name.
  # The unit tests plant ungated paths to prove the check is not vacuous.
  gate:
    name: gate coverage
    runs-on: ubuntu-latest
    # A signed run (martha#129) happens in a sandbox or not at all, so its tests
    # skip where none can be built. Here one must be: a missing sandbox fails a
    # test by name instead of skipping the gate in silence.
    env:
      MARTHA_SANDBOX_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # A checkout's .envrc is one of the doors martha#24 shuts, in two ways:
      # DIRENV_DISABLE for direnv 2.38 and later, and the DIRENV_CONFIG fallback
      # for older ones. Ubuntu's direnv is older, so it proves the fallback; a
      # pinned release proves DIRENV_DISABLE. MARTHA_TESTS_DIRENV names both, and
      # a test fails by name when either is missing, so CI never drops the door.
      #
      # The pinned direnv is built from its tag with go install, which checks the
      # module against Go's public checksum database (sum.golang.org): a tag that
      # moved, or a source that differs from what everyone else got, is refused.
      # That keeps the pin without writing a digest here, which the nothing-private
      # check would take for a node id.
      - run: sudo apt-get install -y --no-install-recommends direnv && direnv version && git --version
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: a pinned direnv that knows DIRENV_DISABLE
        env:
          DIRENV_MODULE: github.com/direnv/direnv/v2@v2.38.2
          GOBIN: ${{ runner.temp }}/direnv-pinned
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
          GOINSECURE: ''
          GOFLAGS: ''
        run: |
          go install "$DIRENV_MODULE"
          "$GOBIN/direnv" version
          echo "MARTHA_TESTS_DIRENV=$(command -v direnv):$GOBIN/direnv" >> "$GITHUB_ENV"
      # bubblewrap builds the sandbox from unprivileged user namespaces, which
      # Ubuntu 24.04 restricts through AppArmor by default; this runner lifts it.
      - name: a sandbox for signed runs
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / true && bwrap --version
      - run: npm ci
      # The unused rule (martha#171) is held by two checks, and a change runs
      # both: the compiler, here and in the installer job (noUnusedLocals and
      # noUnusedParameters in each tsconfig), names an unused import, local or
      # parameter by file, line and symbol; eslint, in the structural floor job,
      # holds the files no tsconfig includes, such as eslint.config.mjs, and the
      # catch binding the compiler never looks at.
      - run: npx tsc --noEmit
      - run: npm test
      # macOS's default TMPDIR is long and is reached through a link
      # (/var -> /private/var), martha#79. The suite runs again under that shape,
      # longer than the default, so a path built under TMPDIR with no room left
      # for a socket, or a path compared without resolving the link, fails here.
      - name: the suite under a long TMPDIR reached through a link
        env:
          PRIVATE_VAR: ${{ runner.temp }}/private/var
          LINKED_VAR: ${{ runner.temp }}/var
          MAC_SHAPED_TMP: folders/zz/abcdefghijklmnopqrstuvwxyz0123/T
        run: |
          mkdir -p "$PRIVATE_VAR/$MAC_SHAPED_TMP"
          chmod 700 "$PRIVATE_VAR/$MAC_SHAPED_TMP"
          ln -s "$PRIVATE_VAR" "$LINKED_VAR"
          TMPDIR="$LINKED_VAR/$MAC_SHAPED_TMP" npm test

  # The structural floor (martha#87): no function nests deeper than two levels,
  # branches past the complexity cap or runs past the length cap. The caps live
  # in eslint.config.mjs; npm test proves they bite (prove_the_core/
  # structure_stays_flat.node-test.ts) and this runs them over the whole tree.
  # No baseline, no continue-on-error, and no warning allowed: an eslint-disable
  # comment is ignored with a warning, so it fails here too.
  #
  # The unused rule (martha#171) also runs here, at error level, for what the
  # compiler cannot see: eslint.config.mjs itself, which belongs to no tsconfig,
  # any .js or .mjs beside the sources, and a catch binding nobody reads.
  structure:
    name: structural floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The installer is a project of its own (its own package.json, published
      # as the signed package), so the floor is run in it as well, by the same
      # eslint and the same eslint.config.mjs, which eslint finds above it.
      - name: the structural floor in the installer
        working-directory: installer
        run: ../node_modules/.bin/eslint . --max-warnings=0

  # The relay loads in the recorded host (martha#104). The host reads a hooks module before it runs it and refuses it
  # whole for a rule it holds; a refused relay runs no gate, and the relay's unit tests drive a stand-in engine that
  # holds none of those rules. This installs Claude Code at the version the adapter was recorded from (read from the
  # recording, never typed here), runs its own loader on the relay, and plants #104's line in a copy to prove it bites.
  # Then a launch with that host on an owner's terminal must leave the installed relay folder as it was (martha#117),
  # after a check that the host does write into a writable one.
  relay:
    name: the relay loads in the recorded host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: prove_the_relay_loads/prove_the_relay_loads.sh "${{ runner.temp }}/relay-loads"

  # The host drift check can fail (martha#139): the recorder's --check passes on a host that says what the recording
  # says and fails, naming the field, on one that does not. No host and no npm: the tests build their host from the
  # recording's own parts, so this runs on every PR, and only host-drift.yml's comparison depends on a release.
  drift-bites:
    name: the host drift check bites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: prove_the_recorded_host_is_current/prove_the_drift_check_bites.sh

  # Every workflow is one GitHub accepts (martha#21 r=3): a workflow GitHub rejects
  # never runs, and the only sign is a failed run with no jobs, which nobody reads.
  # The release workflows run on a tag or by hand only, so this is where a broken
  # one is found first. actionlint is built from the commit its v1.7.12 tag names,
  # with go install checked against sum.golang.org as the pinned direnv is.
  workflows:
    name: workflows are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: actionlint over every workflow
        env:
          ACTIONLINT_MODULE: github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          GOBIN: ${{ runner.temp }}/actionlint-pinned
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
          GOINSECURE: ''
          GOFLAGS: ''
        run: |
          go install "$ACTIONLINT_MODULE"
          "$GOBIN/actionlint" -version
          "$GOBIN/actionlint" -color

  # The installer (martha#21): every refusal it makes, red first, against a local registry; the packed package run
  # from under node_modules; and the names held to their one place across the workflows, both package.json files
  # and the READMEs. The release itself (release.yml) and the dry run run on a tag and by hand only.
  installer:
    name: installer
    runs-on: ubuntu-latest
    # A last backstop, so a hang never holds a runner for GitHub's six hours
    # (martha#112). The test script itself fails a hung test and a leaking file
    # by name. Measured on 2026-11-07: the whole job took 10 to 16 s in the last
    # four green runs on main that ran it and on PR 99 (npm ci from cache, tsc,
    # npm test). Five minutes
    # leaves room for one test running to the script's --test-timeout and an
    # npm cache miss.
    timeout-minutes: 5
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: installer/npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - run: npm test

  # Nothing private gets in (docs/nothing-private-gets-in.md): no private issue
  # link, internal host name or private remote, in the tree or in any commit of
  # the range. The lab's machine families are a secret and are never printed.
  # The self-test proves the live lookup and each family bite before the scan.
  private:
    name: nothing private
    runs-on: ubuntu-latest
    env:
      MARTHA_LAB_HOSTS: ${{ secrets.MARTHA_LAB_HOSTS }}
      MARTHA_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the check bites
        run: npm run check:private -- --self-test
      - name: nothing private in the tree or the range
        run: npm run check:private -- --range "$RANGE"
