name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every link to a file or a heading of this repository resolves. Links to
  # other sites are not checked: lychee runs --offline (DECIDED 2026-11-19 "Links:
  # internal only"), because in two weeks every red they caused was a site
  # refusing or failing the checker, never a link of ours gone dead.
  #
  # A missing file or heading fails at once, by name. The planted dead link is
  # held to both halves: lychee must refuse it, and so must the command the scan
  # actually runs.
  links:
    name: links resolve
    runs-on: ubuntu-latest
    env:
      # The options, defined once and used by both runs below: --offline keeps
      # every request off the network, so only this repository's own files and
      # headings are checked.
      LYCHEE_OPTIONS: '--no-progress --include-fragments --offline'
    steps:
      - uses: actions/checkout@v7
      # This job runs this repository's own Node code now (check_every_link_resolves),
      # so it runs on the Node the other Node jobs pin rather than on whatever the
      # runner image happens to ship. No npm ci: the check imports nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The self-test plants a link to a file that is not there, outside the
      # checkout so the scan below never sees it, and holds the same options to
      # it: the job must still go red, and name that link when it does.
      - name: plant a dead link
        run: |
          mkdir -p "${{ runner.temp }}/links-self-test"
          printf '[a page that is not there](missing-page.md)\n' > "${{ runner.temp }}/links-self-test/dead-link.md"
      - name: the check bites
        id: self_test
        # Pinned like every other action here. It also puts the pinned lychee on
        # PATH for this job, which is the checker the scan below runs, so the two
        # steps can never disagree about which lychee they mean.
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: ${{ env.LYCHEE_OPTIONS }} '${{ runner.temp }}/links-self-test/*.md'
          fail: false
          output: ${{ runner.temp }}/links-self-test/report.md
          jobSummary: false
      - name: the dead link was refused
        env:
          EXIT_CODE: ${{ steps.self_test.outputs.exit_code }}
        # The three tests share one && chain on purpose: a bare `test -n ...`
        # line would not fail the step on an empty value, because bash's -e
        # exempts a non-final command in an && list, and the grep below would
        # then pass on its own.
        run: |
          test -n "$EXIT_CODE" \
            && test "$EXIT_CODE" -ne 0 \
            && grep -q missing-page.md "${{ runner.temp }}/links-self-test/report.md"
      - name: the check below refuses it too, and names it
        # lychee refusing the dead link is not enough: the scan below is this
        # command, and a verdict that passed a dead link would be a check that
        # cannot fail. Exit 1 (refused) is required, not any non-zero: exit 2 is
        # "could not look", which must never read as a bite either.
        run: |
          status=0
          npm run --silent check:links -- '${{ runner.temp }}/links-self-test/*.md' \
            > "${{ runner.temp }}/links-self-test/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            cat "${{ runner.temp }}/links-self-test/verdict.txt"
            exit 1
          fi
          grep -q missing-page.md "${{ runner.temp }}/links-self-test/verdict.txt"
      - name: every link resolves
        # The check itself. A green here means every internal link was seen to
        # resolve; a red names the links.
        run: npm run --silent check:links -- '**/*.md'

  # The publish gate (issue #2): no outsider's text reaches a shell-holding
  # member without a control, and a path added without one fails here by name.
  # The unit tests plant ungated paths to prove the check is not vacuous.
  gate:
    name: gate coverage
    runs-on: ubuntu-latest
    # A signed run (martha#129) happens in a sandbox or not at all, so its tests
    # skip where none can be built. Here one must be: a missing sandbox fails a
    # test by name instead of skipping the gate in silence.
    env:
      MARTHA_SANDBOX_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # A checkout's .envrc is one of the doors martha#24 shuts, in two ways:
      # DIRENV_DISABLE for direnv 2.38 and later, and the DIRENV_CONFIG fallback
      # for older ones. Both kinds are proven: a 2.38 direnv for the first, and
      # the older version Ubuntu ships for the second, which has only the
      # fallback. MARTHA_TESTS_DIRENV names both, and a test fails by name when
      # either is missing, so CI never drops the door
      # (src/drive_the_recorded_host/direnvs_under_test.ts).
      #
      # Both come from their GitHub releases rather than the Ubuntu archive: on
      # 2026-11-11 a hosted runner could not resolve archive.ubuntu.com, and this
      # job went red in the install of one of them with nothing of this
      # repository run (martha#271). github.com answers on these runners -- the
      # checkout comes from it -- and each download is held to the sha256 named
      # here, once per version and restated nowhere. Each digest is written
      # `sha256:<hex>`, the form the nothing-private check reads as a digest
      # rather than as a node id; fetch_the_direnvs.sh verifies it and runs what
      # it verified, and nothing else.
      #
      # The fetch's check is proved before it is trusted: the real download only
      # ever offers the right bytes, so the step below hands it bytes another
      # release serves under the digest this one names, and requires the run to
      # end red, naming the version, with nothing run.
      - name: the direnv fetch refuses bytes that are not the ones its digest names
        run: fetch_the_direnvs/fetch_the_direnvs.sh --self-test
      - name: the two direnvs, from their GitHub releases
        env:
          DIRENV_PINNED_VERSION: 'v2.38.2'
          DIRENV_PINNED_SHA256: 'sha256:148820a187930d36ca6a204504e5cdb30d8396cd1a97e64c3b3f10d793c11247'
          DIRENV_OLDER_VERSION: 'v2.32.1'
          DIRENV_OLDER_SHA256: 'sha256:650d4698e8281a91d045aa0adc6cd45dc94e07957de5f64a8acda27cc431f634'
        run: |
          paths="$(fetch_the_direnvs/fetch_the_direnvs.sh --to "${{ runner.temp }}/direnvs" \
            --version "$DIRENV_PINNED_VERSION" --sha256 "$DIRENV_PINNED_SHA256" \
            --version "$DIRENV_OLDER_VERSION" --sha256 "$DIRENV_OLDER_SHA256")"
          echo "MARTHA_TESTS_DIRENV=$paths" >> "$GITHUB_ENV"
      # bubblewrap builds the sandbox from unprivileged user namespaces, which
      # Ubuntu 24.04 restricts through AppArmor by default; this runner lifts it.
      # It is the one package here that must come from the archive -- it is the
      # distro's own sandbox binary, with no release to fetch instead -- so it
      # goes through the retry, and the step before proves the retry both ways:
      # a blink is survived, and an archive that never comes back is red naming
      # the runner's network rather than reading as a failure of ours.
      - name: the archive install survives a blink, and names the runner when it cannot
        run: install_from_the_ubuntu_archive/install_from_the_ubuntu_archive.sh --self-test
      - name: a sandbox for signed runs
        run: |
          install_from_the_ubuntu_archive/install_from_the_ubuntu_archive.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / true && bwrap --version
      - run: npm ci
      # npm test runs the installer job's own steps too (martha#496), so a suite green here is green there: the
      # installer's dependencies go in first, as that job installs them.
      - name: the installer's own dependencies, for the suite's run of the installer job
        working-directory: installer
        run: npm ci --ignore-scripts
      # The unused rule (martha#171) is held by two checks, and a change runs
      # both: the compiler, here and in the installer job (noUnusedLocals and
      # noUnusedParameters in each tsconfig), names an unused import, local or
      # parameter by file, line and symbol; eslint, in the structural floor job,
      # holds the files no tsconfig includes, such as eslint.config.mjs, and the
      # catch binding the compiler never looks at.
      - run: npx tsc --noEmit
      - run: npm test
      # A TMPDIR can be long and reached through a link on Linux too (martha#79):
      # a unix socket address holds 107 bytes here, and a path built under a
      # long TMPDIR with no room left for one fails with EINVAL (this step caught
      # it in #541 package 9a). The suite runs again under such a TMPDIR, so a
      # path with no room for a socket, or a path compared without resolving the
      # link, fails here.
      - name: the suite under a long TMPDIR reached through a link
        env:
          PRIVATE_VAR: ${{ runner.temp }}/private/var
          LINKED_VAR: ${{ runner.temp }}/var
          LONG_TMP: folders/zz/abcdefghijklmnopqrstuvwxyz0123/T
        run: |
          mkdir -p "$PRIVATE_VAR/$LONG_TMP"
          chmod 700 "$PRIVATE_VAR/$LONG_TMP"
          ln -s "$PRIVATE_VAR" "$LINKED_VAR"
          TMPDIR="$LINKED_VAR/$LONG_TMP" npm test

  # The structural floor (martha#87): no function nests deeper than two levels,
  # branches past the complexity cap or runs past the length cap. The caps live
  # in eslint.config.mjs; npm test proves they bite (prove_the_core/
  # structure_stays_flat.node-test.ts) and this runs them over the whole tree.
  # No baseline, no continue-on-error, and no warning allowed: an eslint-disable
  # comment is ignored with a warning, so it fails here too.
  #
  # The unused rule (martha#171) also runs here, at error level, for what the
  # compiler cannot see: eslint.config.mjs itself, which belongs to no tsconfig,
  # any .js or .mjs beside the sources, and a catch binding nobody reads.
  structure:
    name: structural floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The installer is a project of its own (its own package.json, published
      # as the signed package), so the floor is run in it as well, by the same
      # eslint and the same eslint.config.mjs, which eslint finds above it.
      - name: the structural floor in the installer
        working-directory: installer
        run: ../node_modules/.bin/eslint . --max-warnings=0

  # The line ceiling per host directory (martha#322). No core check reads an
  # adapter or the glue: `no_setting_outside_the_declaration` treats both as
  # outside the core, and no slice may import them. So a decision can hide in
  # one, and the code the port map wants to shrink can grow instead. Each
  # directory package.json declares under martha.hostAdapters or
  # martha.hostGlue carries a ceiling in martha.hostCeilings: how many lines of
  # code it may hold, counting the files the linter reads as code and the lines
  # the compiler reads as code. A ceiling above its directory's count fails as
  # well (martha#341), so a shrink is recorded with --record in the change that
  # made it. The caps are named once, in package.json, and the tests under
  # src/check_a_host_directory_stays_under_its_ceiling/ prove the check bites (one
  # line over, one line under, no ceiling, a `.json` that does not count, code in
  # a dot directory that does), so this job runs the live judge over the tree and
  # nothing else.
  ceilings:
    name: host directories under their ceilings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run --silent check:host-ceilings

  # Martha's names are its own (martha#468): no file, folder, tool, marker or variable of Martha's may be a name
  # crew-code also gives something, or a person reading a path, a transcript or a tool name cannot tell which crew a
  # thing belongs to. It runs as a job and as a node test, so no range gate reads green while the check did not run.
  #
  # The planted tree holds the job to its bite: one name crew-code owns, written outside the checkout, must exit 1 with
  # that name and its line printed. Exit 2 is "could not look", which must never read as a bite either. The plants that
  # empty the table and drop a file kind are in the node test, where each fails by its own name.
  names:
    name: Martha's names are its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run --silent check:marthas-names
      - name: the check bites
        run: |
          mkdir -p "${{ runner.temp }}/names-self-test/src"
          printf "export const tool = 'report_progress'\n" > "${{ runner.temp }}/names-self-test/src/planted.ts"
          status=0
          npm run --silent check:marthas-names -- --root "${{ runner.temp }}/names-self-test" \
            > "${{ runner.temp }}/names-self-test/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            cat "${{ runner.temp }}/names-self-test/verdict.txt"
            exit 1
          fi
          grep -q "planted.ts:1: 'report_progress'" "${{ runner.temp }}/names-self-test/verdict.txt"

  # Two modules that load each other (martha#525). In an ES module cycle one module can read another's export before it
  # has been set, so the value is `undefined` where it is used, and nothing reports the cycle: what CI shows instead is a
  # scatter of failing tests in modules the change never touched. The check follows every value import between the
  # repository's own sources — every code tree, and the files directly in the root (martha#748) — and names the whole
  # loop, file by file; `import type` closes none, because a type is erased.
  #
  # Two pairs are planted, one under `src/` and one under `installer/`, and each printed loop is read back from the
  # check's own verdict: a check that had narrowed back to `src/` would pass a job that planted only the first. Exit 1
  # (refused) is required, not any non-zero: exit 2 is "could not look", which must never read as a bite either.
  cycles:
    name: no import cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run --silent check:no-import-cycle
      - name: the check bites
        run: |
          planted="${{ runner.temp }}/cycles-self-test"
          mkdir -p "$planted/src/one" "$planted/src/two" "$planted/installer"
          printf "import { b } from '../two/b.ts'\nexport const a = b\n" > "$planted/src/one/a.ts"
          printf "import { a } from '../one/a.ts'\nexport const b = a\n" > "$planted/src/two/b.ts"
          printf "import { two } from './two.ts'\nexport const one = two\n" > "$planted/installer/one.ts"
          printf "import { one } from './one.ts'\nexport const two = one\n" > "$planted/installer/two.ts"
          status=0
          npm run --silent check:no-import-cycle -- --root "$planted" > "$planted/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            cat "$planted/verdict.txt"
            exit 1
          fi
          grep -q "src/one/a.ts -> src/two/b.ts -> src/one/a.ts" "$planted/verdict.txt"
          grep -q "installer/one.ts -> installer/two.ts -> installer/one.ts" "$planted/verdict.txt"

  # The relay loads in the recorded host (martha#104). The host reads a hooks module before it runs it and refuses it
  # whole for a rule it holds; a refused relay runs no gate, and the relay's unit tests drive a stand-in engine that
  # holds none of those rules. This installs Claude Code at the version the adapter was recorded from (read from the
  # recording, never typed here), runs its own loader on the relay, and plants #104's line in a copy to prove it bites.
  # Then a launch with that host on an owner's terminal must leave the installed relay folder as it was (martha#117),
  # after a check that the host does write into a writable one.
  #
  # Every other run is a test case that drives the recorded host, and skips everywhere but here (martha#385). The script
  # runs what prove_the_relay_loads/recorded_host_runs.json lists and holds each to its listed case count; the check
  # step first holds that list to the cases the test files carry, so a case nothing runs fails here by name. The suite
  # in the gate job runs the same check, so a PR that adds a case without listing it is red there too.
  relay:
    name: the relay loads in the recorded host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: every recorded-host case is listed and counted
        run: npm run --silent check:recorded-host-runs
      - run: prove_the_relay_loads/prove_the_relay_loads.sh "${{ runner.temp }}/relay-loads"

  # The host drift check can fail (martha#139): the recorder's --check passes on a host that says what the recording
  # says and fails, naming the field, on one that does not. No host and no npm: the tests build their host from the
  # recording's own parts, so this runs on every PR, and only host-drift.yml's comparison depends on a release.
  drift-bites:
    name: the host drift check bites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: prove_the_recorded_host_is_current/prove_the_drift_check_bites.sh
      # The Bash answers harness can fail too (martha#812): the comparison names every difference, and the live mode
      # takes no case from a host that never answers. No host and no npm: the comparison is driven with recordings the
      # tests write, and the live mode with a stand-in `claude`, which is only a path to the harness.
      - run: prove_the_relay_loads/prove_the_bash_answers/prove_the_bash_answers_bites.sh

  # The engine drift check can fail (macula-io/martha#541, package 10): the recorder's --check passes on a tree that
  # says what the recording says and fails, naming the fact, on one that does not, with no engine checkout. Then it
  # passes on the engine's real source at the recorded commit, so the reader is proven on the engine itself and not
  # only on the tree the tests build. Only engine-drift.yml's comparison with the fork's tip depends on the fork moving.
  engine-drift-bites:
    name: the engine drift check bites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: prove_the_recorded_engine_is_current/prove_the_engine_drift_check_bites.sh
      - name: the recording says what the engine says at the recorded commit
        run: prove_the_recorded_engine_is_current/prove_the_recorded_engine_is_current.sh "${{ runner.temp }}/engine-at-the-pin" --at-the-pin

  # Posted text (martha#265): the check that reads what members post on GitHub can fail. Its self-test
  # plants a cited path, in memory, on each of the six surfaces it reads, and a placeholder that must
  # pass, then names the surface whose reader stopped refusing. It needs no token and no network, so it
  # runs on every PR, and the daily run in posted-text.yml is never the first thing to find it broken.
  posted-text-bites:
    name: the posted text check bites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the check bites
        run: npm run --silent check:posted-text -- --self-test

  # The clean-install proof removes its container whatever happens (martha#69). It runs against a host given as a
  # parameter, and this job names none: the script's own stand-ins answer ssh and podman, so the cases run here are
  # the ones a runner can hold -- a passing install half, a refusal, no release, a container that would not go, and
  # an interrupted run, whose container is removed anyway. The image, the container's own answers and the installer
  # are the case's, so a change to the script's own logic fails here by the case that broke.
  clean-install:
    name: the clean-install proof removes its container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: prove_a_clean_install_in_a_throwaway_container/prove_a_clean_install_in_a_throwaway_container.sh --self-test
      # The nightly live run's throwaway repository (martha#639): stand-in gh and git answer, so no GitHub call is
      # made here, and each guard that keeps the bot's token to the bot is a case that fails by name.
      - run: prove_a_clean_install_in_a_throwaway_container/keep_a_throwaway_repository.sh --self-test

  # The ring reaches the owner on a live night's own tmux (martha#843): the night's tmux is the 3.3a its pinned .deb
  # installs in the image the proof pins, and what a pane can send an attached client changed between tmux versions,
  # so the real-tmux cases run there, both read from the proof's own scripts. Green only when every case ran and passed.
  night-ring:
    name: the ring reaches the owner on the night's tmux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: prove_a_clean_install_in_a_throwaway_container/the_ring_on_the_nights_pinned_tmux.sh

  # Every workflow is one GitHub accepts (martha#21 r=3): a workflow GitHub rejects
  # never runs, and the only sign is a failed run with no jobs, which nobody reads.
  # The release workflows run on a tag or by hand only, so this is where a broken
  # one is found first. actionlint is built from the commit its v1.7.12 tag names,
  # with go install checked against sum.golang.org as the pinned direnv is.
  workflows:
    name: workflows are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: actionlint over every workflow
        env:
          ACTIONLINT_MODULE: github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          GOBIN: ${{ runner.temp }}/actionlint-pinned
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
          GOINSECURE: ''
          GOFLAGS: ''
        run: |
          go install "$ACTIONLINT_MODULE"
          "$GOBIN/actionlint" -version
          "$GOBIN/actionlint" -color

  # The installer (martha#21): every refusal it makes, red first, against a local registry; the packed package run
  # from under node_modules; and the names held to their one place across the workflows, both package.json files
  # and the READMEs. The release itself (release.yml) and the dry run run on a tag and by hand only.
  installer:
    name: installer
    runs-on: ubuntu-latest
    # A last backstop, so a hang never holds a runner for GitHub's six hours
    # (martha#112). The test script itself fails a hung test and a leaking file
    # by name. Measured on 2026-11-07: the whole job took 10 to 16 s in the last
    # four green runs on main that ran it and on PR 99 (npm ci from cache, tsc,
    # npm test). Five minutes
    # leaves room for one test running to the script's --test-timeout and an
    # npm cache miss.
    timeout-minutes: 5
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: installer/npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - run: npm test

  # Nothing private gets in (docs/nothing-private-gets-in.md): no private issue
  # link, internal host name or private remote, in the tree or in any commit of
  # the range. The self-test proves the live lookup bites before the scan.
  private:
    name: nothing private
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the check bites
        run: npm run check:private -- --self-test
      - name: nothing private in the tree or the range
        run: npm run check:private -- --range "$RANGE"

  # A branch created from a newer base while the working tree still holds edits
  # made against the older one keeps the tree across the switch, so its next
  # commit carries files at their pre-base content and a test the base passed
  # vanishes with no job going red (martha#274; 2026-11-11, 8ca6eb3 dropped four
  # titles and a documented paragraph, and r=1 was the only thing that noticed).
  # This names every title the merge base holds and the tip no longer does, and
  # the check itself computes that merge base from the two shas below.
  #
  # The shas are the event's own. On a push to main whose `before` is all zeros
  # (a branch's first push) the check answers exit 2 -- it could not look --
  # which is right and must not be "fixed" into a pass.
  #
  # Both plants run the same command the live step runs, so the shas GitHub
  # passes are proven to reach the comparison: a self-test inside the program
  # would leave that unproven. The second plant reads the drop trailer's name
  # from its one definition in the check's own source, never restating it.
  base-tests:
    name: no test the base passed goes missing
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: the check bites
        # Exit 1 (refused) is required, not any non-zero: exit 2 is "could not
        # look", which must never read as a bite either.
        run: |
          repo="${{ runner.temp }}/dropped-test-self-test"
          mkdir -p "$repo/src/x"
          git -C "$repo" init -q
          git -C "$repo" config user.email planted@example.invalid
          git -C "$repo" config user.name planted
          printf '%s\n' "{\"scripts\":{\"test\":\"node --test 'src/**/*.node-test.ts'\"}}" > "$repo/package.json"
          printf "test('a title the tip will drop', () => {})\n" > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m base
          base="$(git -C "$repo" rev-parse HEAD)"
          : > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m tip
          head="$(git -C "$repo" rev-parse HEAD)"
          status=0
          npm run --silent check:base-tests -- --base "$base" --head "$head" --repository "$repo" \
            > "$repo/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then cat "$repo/verdict.txt"; exit 1; fi
          grep -q "a title the tip will drop" "$repo/verdict.txt"
      - name: a deliberate removal passes, its trailer read from its one definition
        run: |
          repo="${{ runner.temp }}/dropped-test-claimed"
          mkdir -p "$repo/src/x"
          git -C "$repo" init -q
          git -C "$repo" config user.email planted@example.invalid
          git -C "$repo" config user.name planted
          printf '%s\n' "{\"scripts\":{\"test\":\"node --test 'src/**/*.node-test.ts'\"}}" > "$repo/package.json"
          printf "test('a title this commit drops', () => {})\n" > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m base
          base="$(git -C "$repo" rev-parse HEAD)"
          : > "$repo/src/x/a.node-test.ts"
          git -C "$repo" add -A
          trailer="$(node --input-type=module -e "import('$GITHUB_WORKSPACE/src/check_no_test_the_base_passed_goes_missing/check_no_test_the_base_passed_goes_missing.ts').then((module) => console.log(module.DROPS_TEST_TRAILER))")"
          git -C "$repo" commit -q -m "fix: drop a test" -m "$trailer: src/x/a.node-test.ts :: a title this commit drops"
          head="$(git -C "$repo" rev-parse HEAD)"
          npm run --silent check:base-tests -- --base "$base" --head "$head" --repository "$repo"
      - name: every test the base passed is still at the tip
        run: npm run --silent check:base-tests -- --base "$BASE_SHA" --head "$HEAD_SHA"

  # The C4 pictures are drawn at release, not carried by every pull request
  # (martha#627): the only change that may touch one is the version-bump pull
  # request, and that change must leave every picture what
  # architecture/c4_diagrams.ts draws. The release reads --tree as its backstop:
  # a stale picture on a tagged tree means the bump's check was bypassed.
  #
  # Both planted repositories prove the reads bite as the job runs them, and exit 1
  # is required rather than any non-zero: exit 2 is "could not look", which must
  # never read as a bite. Nothing here spells a picture's path — the generator
  # names the pictures, and the fixtures ask it.
  #
  # The shas are the event's own. On a push whose `before` is all zeros (a branch's
  # first push) the check answers exit 2 -- it could not look -- which is right and
  # must not be "fixed" into a pass.
  pictures:
    name: the pictures change only with the version
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: the tree read bites
        run: |
          repo="${{ runner.temp }}/pictures-tree-self-test"
          mkdir -p "$repo"
          node --input-type=module -e "import('$GITHUB_WORKSPACE/architecture/c4_diagrams.ts').then((module) => { for (const file of module.THE_PICTURES_THE_C4_DRAWS) console.log(file) })" > "$repo/pictures.txt"
          while read -r file; do
            mkdir -p "$repo/$(dirname "$file")"
            printf 'not the picture the generator draws\n' > "$repo/$file"
          done < "$repo/pictures.txt"
          picture="$(awk 'NR == 1' "$repo/pictures.txt")"
          status=0
          npm run --silent check:pictures -- --tree --repository "$repo" > "$repo/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then cat "$repo/verdict.txt"; exit 1; fi
          grep -q "$picture is not what" "$repo/verdict.txt"
      - name: the range read passes a change that touches no picture, and bites one that does
        run: |
          repo="${{ runner.temp }}/pictures-range-self-test"
          mkdir -p "$repo"
          git -C "$repo" init -q
          git -C "$repo" config user.email planted@example.invalid
          git -C "$repo" config user.name planted
          printf '{"version":"1.0.0"}\n' > "$repo/package.json"
          node --input-type=module -e "import('$GITHUB_WORKSPACE/architecture/c4_diagrams.ts').then((module) => { for (const file of module.THE_PICTURES_THE_C4_DRAWS) console.log(file) })" > "$repo/pictures.txt"
          while read -r file; do
            mkdir -p "$repo/$(dirname "$file")"
            printf 'not the picture the generator draws\n' > "$repo/$file"
          done < "$repo/pictures.txt"
          picture="$(awk 'NR == 1' "$repo/pictures.txt")"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m base
          base="$(git -C "$repo" rev-parse HEAD)"
          printf 'the work\n' > "$repo/a_change.txt"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m 'a change that touches no picture'
          untouched="$(git -C "$repo" rev-parse HEAD)"
          npm run --silent check:pictures -- --base "$base" --head "$untouched" --repository "$repo"
          printf 'another rendering\n' > "$repo/$picture"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m 'a change that touches a picture without the version'
          touched="$(git -C "$repo" rev-parse HEAD)"
          status=0
          npm run --silent check:pictures -- --base "$untouched" --head "$touched" --repository "$repo" > "$repo/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then cat "$repo/verdict.txt"; exit 1; fi
          grep -q "$picture changed in a change that does not bump the version" "$repo/verdict.txt"
      - name: no picture is touched but by the version, and every picture is what the generator draws
        run: npm run --silent check:pictures -- --base "$BASE_SHA" --head "$HEAD_SHA"

  # No literal restates a value the tree defines (martha#289, the rule decided
  # 2026-11-05: no literal restating a value the code already defines, tests
  # included). Two gates, both required:
  #
  # - The whole tree: every literal equal to a value an exported constant holds,
  #   anywhere in the tree, fails the job by file, line and constant name.
  # - The range: the lines the change ADDS, net against the merge base, and over
  #   the whole tree every literal equal to a value the change defines, revalues
  #   or takes away. Only this run sees a value taken away: once a constant is
  #   gone, no constant holds its value for the whole-tree run to compare against,
  #   and every literal still holding it would pass there.
  #
  # The self-test plants one case per rule and requires each to be named. The
  # planted repository below proves the gate bites as the job runs it, so the live
  # step is not the only evidence: a literal a commit adds beside the constant it
  # restates must turn the run red, by file and by constant name. Only the lines a
  # change adds are judged (DECIDED 2026-11-19 "Restated values: new lines only").
  restated-values:
    name: no literal restates a defined value
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: the check bites, one planted case per rule
        run: npm run --silent check:restated-values -- --self-test
      - name: the check bites on a literal a commit adds, through the range GitHub passes
        # Exit 1 (refused) is required, not any non-zero: exit 2 is "could not
        # look", which must never read as a bite either.
        run: |
          repo="${{ runner.temp }}/restated-value-self-test"
          mkdir -p "$repo/src/planted"
          git -C "$repo" init -q
          git -C "$repo" config user.email planted@example.invalid
          git -C "$repo" config user.name planted
          printf "export const PLANTED = 'a-planted-value'\n" > "$repo/src/planted/a.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m base
          base="$(git -C "$repo" rev-parse HEAD)"
          printf "const name = 'a-planted-value'\n" > "$repo/src/planted/b.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -q -m tip
          head="$(git -C "$repo" rev-parse HEAD)"
          status=0
          npm run --silent check:restated-values -- --range "$base..$head" --root "$repo" \
            > "$repo/verdict.txt" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then cat "$repo/verdict.txt"; exit 1; fi
          grep -q "planted/b.ts:1: 'a-planted-value' restates planted/a.ts PLANTED" "$repo/verdict.txt"
      - name: no literal restates a defined value, in the range or a value it defines
        run: npm run --silent check:restated-values -- --range "$BASE_SHA..$HEAD_SHA"

  # Every check is run (martha#741). A check nothing runs passes forever: its tests prove a rule no change is held to.
  # Every `check:` script of package.json must be run, on one step line, by a job every pull request triggers (no paths
  # filter), and every job that names a `check:` script must name one package.json declares. A line inside a block, a
  # self-test or a planted run does not count as running a check, so deleting a check's real step fails here by name.
  # The self-test plants a check no job runs and requires it named; the real run covers this job's own script too.
  every-check-runs:
    name: every check runs in a job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: the check bites on a planted check no job runs
        run: npm run --silent check:every-check-runs-in-a-job -- --self-test
      - name: every check script is run by a job a pull request triggers
        run: npm run --silent check:every-check-runs-in-a-job
