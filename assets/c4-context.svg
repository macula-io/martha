<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="Martha system context">
<title>Martha system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-team { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #A56F0A; stroke-width: 1.25; }
.b-dat { fill: #FBF6EA; stroke: #A56F0A; stroke-width: 1.25; }
.b-team { fill: #FFFFFF; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-later { fill: #F3F4F3; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-team { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #E3AA3C; }
.b-dat { fill: #2A2414; stroke: #E3AA3C; }
.b-team { fill: #171F1C; stroke: #A9A4C8; }
.b-later { fill: #1C2421; stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-team { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="720"/>
<rect class="b-per" x="30" y="20" width="250" height="124" rx="10"/>
<circle class="head" cx="56" cy="44" r="9"/>
<text class="t-name" x="74" y="48">The owner</text>
<text class="t-type" x="74" y="66">[Person]</text>
<text class="t-desc" x="46" y="90">Runs martha in their project</text>
<text class="t-desc" x="46" y="106">and reads what it asks; gives</text>
<text class="t-desc" x="46" y="122">the yes to every push</text>
<rect class="b-later" x="375" y="20" width="250" height="124" rx="10"/>
<text class="t-name" x="391" y="48">npm registry</text>
<text class="t-type" x="391" y="66">[External: not published yet]</text>
<text class="t-desc" x="391" y="90">Will carry the signed package;</text>
<text class="t-desc" x="391" y="106">today Martha is installed from</text>
<text class="t-desc" x="391" y="122">a checkout (#2, #21)</text>
<rect class="b-later" x="720" y="20" width="250" height="124" rx="10"/>
<circle class="head" cx="746" cy="44" r="9"/>
<text class="t-name" x="764" y="48">Teammates</text>
<text class="t-type" x="764" y="66">[Person, team mode]</text>
<text class="t-desc" x="736" y="90">More people on the crew, and</text>
<text class="t-desc" x="736" y="106">the roles the team names; not</text>
<text class="t-desc" x="736" y="122">built in this release</text>
<rect class="b-ext" x="30" y="210" width="250" height="140" rx="10"/>
<text class="t-name" x="46" y="238">Claude Code</text>
<text class="t-type" x="46" y="256">[External: coding tool]</text>
<text class="t-desc" x="46" y="280">The session a member is: a</text>
<text class="t-desc" x="46" y="296">Claude Code process Martha</text>
<text class="t-desc" x="46" y="312">starts, with its own model and</text>
<text class="t-desc" x="46" y="328">its own tools</text>
<rect class="b-sys" x="375" y="210" width="250" height="140" rx="10"/>
<text class="t-name" x="391" y="238">Martha</text>
<text class="t-type" x="391" y="256">[In scope, one machine]</text>
<text class="t-desc" x="391" y="280">A crew of coding agents: it</text>
<text class="t-desc" x="391" y="296">starts a member on config the</text>
<text class="t-desc" x="391" y="312">owner read and approved, and</text>
<text class="t-desc" x="391" y="328">refuses what was not approved</text>
<rect class="b-ext" x="720" y="210" width="250" height="140" rx="10"/>
<text class="t-name" x="736" y="238">A terminal</text>
<text class="t-type" x="736" y="256">[External system]</text>
<text class="t-desc" x="736" y="280">Where the owner types, and</text>
<text class="t-desc" x="736" y="296">where a member runs: martha</text>
<text class="t-desc" x="736" y="312">start holds the terminal it</text>
<text class="t-desc" x="736" y="328">was run in</text>
<rect class="b-ext" x="30" y="430" width="250" height="140" rx="10"/>
<text class="t-name" x="46" y="458">git and GitHub</text>
<text class="t-type" x="46" y="476">[External systems]</text>
<text class="t-desc" x="46" y="500">The project is a git checkout;</text>
<text class="t-desc" x="46" y="516">a member reaches GitHub with</text>
<text class="t-desc" x="46" y="532">its own gh and git, under the</text>
<text class="t-desc" x="46" y="548">shell gate</text>
<rect class="b-ext" x="375" y="430" width="250" height="140" rx="10"/>
<text class="t-name" x="391" y="458">Anthropic model API</text>
<text class="t-type" x="391" y="476">[External: the tool's own]</text>
<text class="t-desc" x="391" y="500">The coding tool talks to it;</text>
<text class="t-desc" x="391" y="516">Martha never does, and never</text>
<text class="t-desc" x="391" y="532">sees a prompt the tool did not</text>
<text class="t-desc" x="391" y="548">hand it</text>
<rect class="b-mac" x="720" y="430" width="250" height="140" rx="10"/>
<text class="t-name" x="736" y="458">Macula mesh and realm</text>
<text class="t-type" x="736" y="476">[Macula]</text>
<text class="t-desc" x="736" y="500">A mesh server runs only when your</text>
<text class="t-desc" x="736" y="516">project's config names one; the</text>
<text class="t-desc" x="736" y="532">room and admission are team mode,</text>
<text class="t-desc" x="736" y="548">and this release runs neither</text>
<path class="edge" d="M155 144V180H420V210" marker-end="url(#a)"/>
<text class="t-rel" x="300" y="172">runs init, approve, start</text>
<path class="edge-team" d="M500 144V210" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="180">once published</text>
<path class="edge-team" d="M845 144V180H600V210" marker-end="url(#a)"/>
<text class="t-rel" x="700" y="172">their seats</text>
<path class="edge" d="M375 280H280" marker-end="url(#a)"/>
<text class="t-rel" x="327" y="272" text-anchor="middle">starts a member</text>
<path class="edge" d="M625 280H720" marker-end="url(#a)"/>
<text class="t-rel" x="672" y="272" text-anchor="middle">start holds it</text>
<path class="edge" d="M280 300V380H155V430" marker-end="url(#a)"/>
<text class="t-rel" x="160" y="400">git, gh</text>
<path class="edge" d="M280 330H340V470H375" marker-end="url(#a)"/>
<text class="t-rel" x="300" y="470" text-anchor="middle">its own model</text>
<path class="edge-team" d="M585 350V410H660V430" marker-end="url(#a)"/>
<text class="t-rel" x="668" y="420">the room, by invite</text>
<text class="t-desc" x="30" y="618">Solo mode, which is what this release is, needs the owner, a coding tool and a git checkout: no account and no service, and it admits no room message.</text>
<text class="t-desc" x="30" y="636">The member Martha starts is a Claude Code session, so the trust the owner gives that folder and the sign-in it holds are the session's.</text>
<text class="t-desc" x="30" y="654">Team mode adds teammates, and the room and admission drawn dashed here; a mesh server is installed and run only when a project's config names one.</text>
<rect class="b-sys" x="24" y="690" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="702">Martha</text>
<rect class="b-per" x="103.168" y="690" width="22" height="14" rx="3"/>
<text class="t-leg" x="133.168" y="702">Person</text>
<rect class="b-mac" x="182.9" y="690" width="22" height="14" rx="3"/>
<text class="t-leg" x="212.9" y="702">Macula, room not shipped</text>
<rect class="b-ext" x="370.75199999999995" y="690" width="22" height="14" rx="3"/>
<text class="t-leg" x="400.75199999999995" y="702">External system</text>
<rect class="b-later" x="503.6439999999999" y="690" width="22" height="14" rx="3"/>
<text class="t-leg" x="533.6439999999999" y="702">Planned, not built</text>
</svg>
