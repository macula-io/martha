<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1750" role="img" aria-label="Martha components">
<title>Martha components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-team { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #A56F0A; stroke-width: 1.25; }
.b-dat { fill: #FBF6EA; stroke: #A56F0A; stroke-width: 1.25; }
.b-team { fill: #FFFFFF; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-later { fill: #F3F4F3; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-team { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #E3AA3C; }
.b-dat { fill: #2A2414; stroke: #E3AA3C; }
.b-team { fill: #171F1C; stroke: #A9A4C8; }
.b-later { fill: #1C2421; stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-team { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="1750"/>
<rect class="b-sys" x="32" y="70" width="300" height="132" rx="10"/>
<text class="t-code" x="48" y="98">run_the_martha_command</text>
<text class="t-type" x="48" y="116">[the acts]</text>
<text class="t-desc" x="48" y="140">init, approve, start &lt;member&gt;, run &lt;shape&gt;,</text>
<text class="t-desc" x="48" y="156">pin-key, keep-shapes, --version: the words</text>
<text class="t-desc" x="48" y="172">checked first, a refusal on stderr with</text>
<text class="t-desc" x="48" y="188">the command that fixes it, 0 / 1 / 2</text>
<rect class="b-cmp" x="348" y="70" width="300" height="132" rx="10"/>
<text class="t-code" x="364" y="98">declare_a_solo_crew, declare_crew</text>
<text class="t-type" x="364" y="116">[the declaration]</text>
<text class="t-desc" x="364" y="140">Reads .crew/crew.json once into typed</text>
<text class="t-desc" x="364" y="156">settings; writes it only when none exists.</text>
<text class="t-desc" x="364" y="172">who_may_act holds the mode's table of</text>
<text class="t-desc" x="364" y="188">who may assign, approve and resume</text>
<rect class="b-cmp" x="664" y="70" width="300" height="132" rx="10"/>
<text class="t-code" x="680" y="98">approve_a_checkouts_config</text>
<text class="t-type" x="680" y="116">[the owner's yes]</text>
<text class="t-desc" x="680" y="140">Names every file that starts code and</text>
<text class="t-desc" x="680" y="156">the checkout's tree, asks on the owner's</text>
<text class="t-desc" x="680" y="172">own terminal, and keeps the fingerprint</text>
<text class="t-desc" x="680" y="188">it was given in approvals.jsonl</text>
<rect class="b-cmp" x="32" y="218" width="300" height="148" rx="10"/>
<text class="t-code" x="48" y="246">start_a_member</text>
<text class="t-type" x="48" y="264">[one member]</text>
<text class="t-desc" x="48" y="288">Refuses no terminal, a name the crew lacks</text>
<text class="t-desc" x="48" y="304">and a stale approval; -- words pass only</text>
<text class="t-desc" x="48" y="320">pass_only_switches_that_load_no_config</text>
<text class="t-desc" x="48" y="336">allows, then names the approval it starts</text>
<text class="t-desc" x="48" y="352">on and holds the terminal</text>
<rect class="b-cmp" x="348" y="218" width="300" height="212" rx="10"/>
<text class="t-code" x="364" y="246">launch_a_claude_code_member</text>
<text class="t-type" x="364" y="264">[the launcher]</text>
<text class="t-desc" x="364" y="288">Martha's places, the approved snapshot,</text>
<text class="t-desc" x="364" y="304">a launch record before the host starts;</text>
<text class="t-desc" x="364" y="320">raise_a_turn_to_the_member raises each</text>
<text class="t-desc" x="364" y="336">kept turn to its listeners, and hand_a_</text>
<text class="t-desc" x="364" y="352">crew_message_to_its_member hands one</text>
<text class="t-desc" x="364" y="368">message at a time and counts it taken</text>
<text class="t-desc" x="364" y="384">in; run_an_owner_signed_command runs a</text>
<text class="t-desc" x="364" y="400">shape the owner signed on a verified</text>
<text class="t-desc" x="364" y="416">copy, in a sandbox</text>
<rect class="b-cmp" x="664" y="218" width="300" height="198" rx="10"/>
<text class="t-code" x="680" y="246">refuse_launch_of_</text>
<text class="t-code" x="680" y="264">unapproved_config</text>
<text class="t-type" x="680" y="282">[the launch gate]</text>
<text class="t-desc" x="680" y="306">Fingerprints the config and the tree</text>
<text class="t-desc" x="680" y="322">id at start, and allows only what was</text>
<text class="t-desc" x="680" y="338">approved, plus remember_a_members_</text>
<text class="t-desc" x="680" y="354">own_writes; refuse_code_a_checkout_</text>
<text class="t-desc" x="680" y="370">runs_itself closes a checkout's scripts;</text>
<text class="t-desc" x="680" y="386">run_marthas_own_git the settings each</text>
<text class="t-desc" x="680" y="402">of Martha's own git runs carries</text>
<rect class="b-dat" x="32" y="446" width="300" height="166" rx="10"/>
<text class="t-code" x="48" y="474">keep_martha_state_</text>
<text class="t-code" x="48" y="492">outside_the_checkout</text>
<text class="t-type" x="48" y="510">[Martha's state]</text>
<text class="t-desc" x="48" y="534">One directory per project, named by a</text>
<text class="t-desc" x="48" y="550">hash of its path: approvals, launches,</text>
<text class="t-desc" x="48" y="566">keep_what_the_owner_signed;</text>
<text class="t-desc" x="48" y="582">row_streams_directory appends rows</text>
<text class="t-desc" x="48" y="598">as files</text>
<rect class="b-cmp" x="348" y="446" width="300" height="150" rx="10"/>
<text class="t-code" x="364" y="474">host_contract,</text>
<text class="t-code" x="364" y="492">linux_process_identity</text>
<text class="t-type" x="364" y="510">[the host contract, and this machine]</text>
<text class="t-desc" x="364" y="534">What the core may ask of a coding tool:</text>
<text class="t-desc" x="364" y="550">a clock, stores, running a process,</text>
<text class="t-desc" x="364" y="566">delivery in and out; linux_process_identity</text>
<text class="t-desc" x="364" y="582">answers all of it for this machine</text>
<rect class="b-cmp" x="664" y="446" width="300" height="164" rx="10"/>
<text class="t-code" x="680" y="474">install_the_recorded_mesh_server</text>
<text class="t-type" x="680" y="492">[recorded trees]</text>
<text class="t-desc" x="680" y="516">A tree by bytes, never by version:</text>
<text class="t-desc" x="680" y="532">record_mesh_server_tools records it,</text>
<text class="t-desc" x="680" y="548">record_ring_results rings one server</text>
<text class="t-desc" x="680" y="564">with another and keeps the keys,</text>
<text class="t-desc" x="680" y="580">prove_the_mesh_server_bytes compares it</text>
<text class="t-desc" x="680" y="596">again, and the launcher installs it</text>
<rect class="b-cmp" x="32" y="628" width="300" height="132" rx="10"/>
<text class="t-code" x="48" y="656">inbound_paths</text>
<text class="t-type" x="48" y="674">[every path, and its control]</text>
<text class="t-desc" x="48" y="698">Every way text reaches a session and</text>
<text class="t-desc" x="48" y="714">every way a checkout starts code, each</text>
<text class="t-desc" x="48" y="730">row naming the gate on it; check_every_</text>
<text class="t-desc" x="48" y="746">path_is_gated fails CI on a gap</text>
<rect class="b-cmp" x="348" y="628" width="300" height="198" rx="10"/>
<text class="t-code" x="364" y="656">take_in_a_turn, shell_tools,</text>
<text class="t-code" x="364" y="674">answer_a_tool_call</text>
<text class="t-type" x="364" y="692">[the shell gate]</text>
<text class="t-desc" x="364" y="716">A turn or a tool's result: take_in_a_turn,</text>
<text class="t-desc" x="364" y="732">take_in_a_tool_result, shell_tools,</text>
<text class="t-desc" x="364" y="748">answer_a_tool_call, read_a_ring_results_</text>
<text class="t-desc" x="364" y="764">sender, refuse_execution_after_ungated_</text>
<text class="t-desc" x="364" y="780">text, trust_only_framed_envelopes; keep_</text>
<text class="t-desc" x="364" y="796">the_shell_for_an_owner_signed_command;</text>
<text class="t-desc" x="364" y="812">hash_a_file_under_a_tree, what a file is</text>
<rect class="b-cmp" x="664" y="628" width="300" height="148" rx="10"/>
<text class="t-code" x="680" y="656">name_the_source_of_a_prompt</text>
<text class="t-type" x="680" y="674">[whose text it was]</text>
<text class="t-desc" x="680" y="698">The origin a host attests, carried with</text>
<text class="t-desc" x="680" y="714">the turn: attribute_a_cross_session_sender,</text>
<text class="t-desc" x="680" y="730">carry_taint_across_a_refresh, and the shell</text>
<text class="t-desc" x="680" y="746">gate's reading; trust_only_signed_lists is</text>
<text class="t-desc" x="680" y="762">how every list a gate trusts is opened</text>
<rect class="b-cmp" x="32" y="842" width="300" height="148" rx="10"/>
<text class="t-code" x="48" y="870">admit_a_room_message</text>
<text class="t-type" x="48" y="888">[loaded; the room is not built]</text>
<text class="t-desc" x="48" y="912">Every launch loads these, though the room</text>
<text class="t-desc" x="48" y="928">they serve is not built: the node id a</text>
<text class="t-desc" x="48" y="944">member has; read_a_room_through_its_gate</text>
<text class="t-desc" x="48" y="960">gives the mesh server's tools, and refuse_</text>
<text class="t-desc" x="48" y="976">widening_a_member_reach refuses the rest</text>
<rect class="b-cmp" x="348" y="842" width="300" height="166" rx="10"/>
<text class="t-code" x="364" y="870">claude_code_host,</text>
<text class="t-code" x="364" y="888">claude_code_relay</text>
<text class="t-type" x="364" y="906">[the Claude Code host]</text>
<text class="t-desc" x="364" y="930">The host contract on Claude Code: the</text>
<text class="t-desc" x="364" y="946">plugin, its hooks, the relay on a socket</text>
<text class="t-desc" x="364" y="962">and the member's tools; refuse_a_member_</text>
<text class="t-desc" x="364" y="978">writing_owner_memory keeps a member's</text>
<text class="t-desc" x="364" y="994">writes out of the owner's memory</text>
<rect class="b-cmp" x="664" y="842" width="300" height="262" rx="10"/>
<text class="t-code" x="680" y="870">check_nothing_private_gets_in,</text>
<text class="t-code" x="680" y="888">check_every_link_resolves</text>
<text class="t-type" x="680" y="906">[this repository's own checks]</text>
<text class="t-desc" x="680" y="930">A private issue link, an internal host</text>
<text class="t-desc" x="680" y="946">name or a private remote fails CI by</text>
<text class="t-desc" x="680" y="962">name; so does a home path in the text</text>
<text class="t-desc" x="680" y="978">members post on GitHub, which check_</text>
<text class="t-desc" x="680" y="994">posted_text_carries_nothing_private</text>
<text class="t-desc" x="680" y="1010">reads daily. A badge host that answers</text>
<text class="t-desc" x="680" y="1026">408 is asked again before its link is</text>
<text class="t-desc" x="680" y="1042">broken; check_the_logos_are_valid_svg</text>
<text class="t-desc" x="680" y="1058">holds every logo to well-formed XML;</text>
<text class="t-desc" x="680" y="1074">check_no_test_the_base_passed_goes_</text>
<text class="t-desc" x="680" y="1090">missing names a dropped test; each bites</text>
<rect class="b-cmp" x="32" y="1120" width="300" height="148" rx="10"/>
<text class="t-code" x="48" y="1148">install_the_pinned_installer</text>
<text class="t-type" x="48" y="1166">[the installer this release pins]</text>
<text class="t-desc" x="48" y="1190">martha install: reads the pin from the</text>
<text class="t-desc" x="48" y="1206">running release, fetches exactly that</text>
<text class="t-desc" x="48" y="1222">installer version through run_the_nodes_</text>
<text class="t-desc" x="48" y="1238">own_npm_alone, refuses other bytes, and</text>
<text class="t-desc" x="48" y="1254">runs it with the words unchanged</text>
<rect class="b-cmp" x="348" y="1120" width="300" height="164" rx="10"/>
<text class="t-code" x="364" y="1148">run_the_nodes_own_npm_alone</text>
<text class="t-type" x="364" y="1166">[npm, and nothing of the machine's]</text>
<text class="t-desc" x="364" y="1190">The npm beside this node, run with</text>
<text class="t-desc" x="364" y="1206">empty user and global config, one named</text>
<text class="t-desc" x="364" y="1222">registry, --ignore-scripts and an</text>
<text class="t-desc" x="364" y="1238">environment built from HOME and PATH</text>
<text class="t-desc" x="364" y="1254">alone: the mesh server and the installer,</text>
<text class="t-desc" x="364" y="1270">one isolation</text>
<rect class="b-cmp" x="664" y="1120" width="300" height="278" rx="10"/>
<text class="t-code" x="680" y="1148">show_dashboard_beat,</text>
<text class="t-code" x="680" y="1166">keep_the_ledger</text>
<text class="t-type" x="680" y="1184">[the crew's rows and its ledger]</text>
<text class="t-desc" x="680" y="1208">show_dashboard_beat holds a member's row</text>
<text class="t-desc" x="680" y="1224">and the rule the newest beat wins;</text>
<text class="t-desc" x="680" y="1240">report_progress moves it, and</text>
<text class="t-desc" x="680" y="1256">see_the_crew lays every row out;</text>
<text class="t-desc" x="680" y="1272">a_crews_tools answers all six tools.</text>
<text class="t-desc" x="680" y="1288">keep_the_ledger loads log_ledger, whose</text>
<text class="t-desc" x="680" y="1304">streams sit in the crew's own state;</text>
<text class="t-desc" x="680" y="1320">keep_the_crew_channel is where a message</text>
<text class="t-desc" x="680" y="1336">lives, send_a_crew_message writes one,</text>
<text class="t-desc" x="680" y="1352">show_what_a_message_became reads back</text>
<text class="t-desc" x="680" y="1368">what became of it, and read_a_crew_line</text>
<text class="t-desc" x="680" y="1384">reads the HANDOFF and VERDICT lines</text>
<rect class="b-cmp" x="32" y="1414" width="300" height="148" rx="10"/>
<text class="t-code" x="48" y="1442">write_my_handover</text>
<text class="t-type" x="48" y="1460">[the host writes a handover]</text>
<text class="t-desc" x="48" y="1484">A member's handover is written by the</text>
<text class="t-desc" x="48" y="1500">host, at the path the host chose, and</text>
<text class="t-desc" x="48" y="1516">stamped: one file per member per day</text>
<text class="t-desc" x="48" y="1532">in the crew's own store, so a file the</text>
<text class="t-desc" x="48" y="1548">member wrote itself is not a handover</text>
<rect class="b-cmp" x="348" y="1414" width="300" height="148" rx="10"/>
<text class="t-code" x="364" y="1442">park_and_wake_a_member</text>
<text class="t-type" x="364" y="1460">[a park that outlives a session]</text>
<text class="t-desc" x="364" y="1484">A member's park is a marker in the</text>
<text class="t-desc" x="364" y="1500">crew's store, so a clear, a restart or a</text>
<text class="t-desc" x="364" y="1516">refresh cannot lose it; who may park</text>
<text class="t-desc" x="364" y="1532">another member is the declaration's</text>
<text class="t-desc" x="364" y="1548">table, not who_may_act (martha#255 r=3)</text>
<rect class="b-cmp" x="664" y="1414" width="300" height="148" rx="10"/>
<text class="t-code" x="680" y="1442">crew_files_directory</text>
<text class="t-type" x="680" y="1460">[the crew's store, on this machine]</text>
<text class="t-desc" x="680" y="1484">The host contract's crew store as files</text>
<text class="t-desc" x="680" y="1500">in one directory: a place per name, a</text>
<text class="t-desc" x="680" y="1516">file kept whole under a staging name</text>
<text class="t-desc" x="680" y="1532">and 0600, and nothing read that is not</text>
<text class="t-desc" x="680" y="1548">this user's alone (martha#254, #255)</text>
<rect class="bound" x="16" y="40" width="968" height="1546" rx="12"/>
<text class="t-bound" x="32" y="62">Martha [the code in src/, one directory per capability]</text>
<text class="t-desc" x="24" y="1626">Every box is a directory in src/: the name is the capability, and its test sits beside it. Two directories are drawn nowhere on purpose:</text>
<text class="t-desc" x="24" y="1644">the two scripts run by hand when a host is recorded, probe_launch_hosts and record_claude_code_host. The crew ledger is drawn in the crew's</text>
<text class="t-desc" x="24" y="1662">own box because a lockup now loads it. record_mesh_server_tools is drawn because the launcher imports what it recorded; the</text>
<text class="t-desc" x="24" y="1680">room itself is not built, and solo admits nothing, though every launch loads the node id, the tool list and the gates its slices hold.</text>
<rect class="b-sys" x="24" y="1720" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="1732">Martha</text>
<rect class="b-cmp" x="103.168" y="1720" width="22" height="14" rx="3"/>
<text class="t-leg" x="133.168" y="1732">Container or component</text>
<rect class="b-dat" x="277.93999999999994" y="1720" width="22" height="14" rx="3"/>
<text class="t-leg" x="307.93999999999994" y="1732">Data, in the project</text>
<rect class="bound" x="424.5719999999999" y="1720" width="22" height="14" rx="3"/>
<text class="t-leg" x="454.5719999999999" y="1732">Boundary</text>
</svg>
