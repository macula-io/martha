<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" role="img" aria-label="Martha components">
<title>Martha components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-team { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #A56F0A; stroke-width: 1.25; }
.b-dat { fill: #FBF6EA; stroke: #A56F0A; stroke-width: 1.25; }
.b-team { fill: #FFFFFF; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-later { fill: #F3F4F3; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-team { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #E3AA3C; }
.b-dat { fill: #2A2414; stroke: #E3AA3C; }
.b-team { fill: #171F1C; stroke: #A9A4C8; }
.b-later { fill: #1C2421; stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-team { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="1020"/>
<rect class="bound" x="16" y="40" width="968" height="850" rx="12"/>
<text class="t-bound" x="32" y="62">Martha [the code in src/, one directory per capability]</text>
<rect class="b-sys" x="32" y="70" width="300" height="128" rx="10"/>
<text class="t-code" x="48" y="98">run_the_martha_command</text>
<text class="t-type" x="48" y="116">[the four acts]</text>
<text class="t-desc" x="48" y="140">init, approve, start &lt;member&gt;, --version:</text>
<text class="t-desc" x="48" y="156">the words checked before anything runs,</text>
<text class="t-desc" x="48" y="172">a refusal on stderr with the command that</text>
<text class="t-desc" x="48" y="188">fixes it, 0 done / 1 refused / 2 usage</text>
<rect class="b-cmp" x="348" y="70" width="300" height="128" rx="10"/>
<text class="t-code" x="364" y="98">declare_a_solo_crew, declare_crew</text>
<text class="t-type" x="364" y="116">[the declaration]</text>
<text class="t-desc" x="364" y="140">Reads .crew/crew.json once into typed</text>
<text class="t-desc" x="364" y="156">settings; writes it only when none exists.</text>
<text class="t-desc" x="364" y="172">who_may_act holds the mode's table of</text>
<text class="t-desc" x="364" y="188">who may assign, approve and resume</text>
<rect class="b-cmp" x="664" y="70" width="300" height="128" rx="10"/>
<text class="t-code" x="680" y="98">approve_a_checkouts_config</text>
<text class="t-type" x="680" y="116">[the owner's yes]</text>
<text class="t-desc" x="680" y="140">Names every file that starts code and</text>
<text class="t-desc" x="680" y="156">the checkout's tree, asks on the owner's</text>
<text class="t-desc" x="680" y="172">own terminal, and keeps the fingerprint</text>
<text class="t-desc" x="680" y="188">it was given in approvals.jsonl</text>
<rect class="b-cmp" x="32" y="214" width="300" height="146" rx="10"/>
<text class="t-code" x="48" y="242">start_a_member</text>
<text class="t-type" x="48" y="260">[one member]</text>
<text class="t-desc" x="48" y="284">Refuses no terminal, a name the crew lacks</text>
<text class="t-desc" x="48" y="300">and a stale approval; -- words pass only</text>
<text class="t-desc" x="48" y="316">pass_only_switches_that_load_no_config</text>
<text class="t-desc" x="48" y="332">allows, then names the approval it starts</text>
<text class="t-desc" x="48" y="348">on and holds the terminal</text>
<rect class="b-cmp" x="348" y="214" width="300" height="146" rx="10"/>
<text class="t-code" x="364" y="242">launch_a_claude_code_member</text>
<text class="t-type" x="364" y="260">[the launcher]</text>
<text class="t-desc" x="364" y="284">The places in Martha's state, a</text>
<text class="t-desc" x="364" y="300">snapshot of what was approved, a launch</text>
<text class="t-desc" x="364" y="316">record written before the host starts,</text>
<text class="t-desc" x="364" y="332">and the host's command and arguments</text>
<rect class="b-cmp" x="664" y="214" width="300" height="146" rx="10"/>
<text class="t-code" x="680" y="242">refuse_launch_of_unapproved_config</text>
<text class="t-type" x="680" y="260">[the launch gate]</text>
<text class="t-desc" x="680" y="284">Fingerprints the config and the tree</text>
<text class="t-desc" x="680" y="300">id at start, and allows only what was</text>
<text class="t-desc" x="680" y="316">approved; refuse_code_a_checkout_runs_</text>
<text class="t-desc" x="680" y="332">itself closes a checkout's own scripts</text>
<rect class="b-dat" x="32" y="376" width="300" height="150" rx="10"/>
<text class="t-code" x="48" y="404">keep_martha_state_</text>
<text class="t-code" x="48" y="422">outside_the_checkout</text>
<text class="t-type" x="48" y="440">[Martha's state]</text>
<text class="t-desc" x="48" y="464">One directory per project, named by a</text>
<text class="t-desc" x="48" y="480">hash of its path: node ids, approvals,</text>
<text class="t-desc" x="48" y="496">launches, snapshots. row_streams_</text>
<text class="t-desc" x="48" y="512">directory appends rows as files</text>
<rect class="b-cmp" x="348" y="376" width="300" height="150" rx="10"/>
<text class="t-code" x="364" y="404">host_contract,</text>
<text class="t-code" x="364" y="422">linux_process_identity</text>
<text class="t-type" x="364" y="440">[the host contract, and this machine]</text>
<text class="t-desc" x="364" y="464">What the core may ask of a coding tool:</text>
<text class="t-desc" x="364" y="480">a clock, stores, running a process,</text>
<text class="t-desc" x="364" y="496">delivery in and out; linux_process_identity</text>
<text class="t-desc" x="364" y="512">answers all of it for this machine</text>
<rect class="b-cmp" x="664" y="376" width="300" height="150" rx="10"/>
<text class="t-code" x="680" y="404">install_the_recorded_mesh_server</text>
<text class="t-type" x="680" y="422">[recorded trees]</text>
<text class="t-desc" x="680" y="446">A tree by bytes, never by version:</text>
<text class="t-desc" x="680" y="462">record_mesh_server_tools records it,</text>
<text class="t-desc" x="680" y="478">prove_the_mesh_server_bytes compares it</text>
<text class="t-desc" x="680" y="494">again, and the launcher installs it</text>
<rect class="b-cmp" x="32" y="542" width="300" height="170" rx="10"/>
<text class="t-code" x="48" y="570">inbound_paths</text>
<text class="t-type" x="48" y="588">[every path, and its control]</text>
<text class="t-desc" x="48" y="612">Every way text reaches a session and</text>
<text class="t-desc" x="48" y="628">every way a checkout starts code, each</text>
<text class="t-desc" x="48" y="644">row naming the gate on it; check_every_</text>
<text class="t-desc" x="48" y="660">path_is_gated fails CI on a gap</text>
<rect class="b-cmp" x="348" y="542" width="300" height="170" rx="10"/>
<text class="t-code" x="364" y="570">take_in_a_turn, shell_tools,</text>
<text class="t-code" x="364" y="588">answer_a_tool_call</text>
<text class="t-type" x="364" y="606">[the shell gate]</text>
<text class="t-desc" x="364" y="630">What a host calls when a session took</text>
<text class="t-desc" x="364" y="646">something in, and what may run after:</text>
<text class="t-desc" x="364" y="662">refuse_execution_after_ungated_text stops</text>
<text class="t-desc" x="364" y="678">everything after unvetted text, and what</text>
<text class="t-desc" x="364" y="694">it believes is trust_only_framed_envelopes</text>
<rect class="b-cmp" x="664" y="542" width="300" height="170" rx="10"/>
<text class="t-code" x="680" y="570">name_the_source_of_a_prompt</text>
<text class="t-type" x="680" y="588">[whose text it was]</text>
<text class="t-desc" x="680" y="612">The origin a host attests, carried with</text>
<text class="t-desc" x="680" y="628">the turn: attribute_a_cross_session_sender,</text>
<text class="t-desc" x="680" y="644">carry_taint_across_a_refresh, and the shell</text>
<text class="t-desc" x="680" y="660">gate's reading; trust_only_signed_lists is</text>
<text class="t-desc" x="680" y="676">how every list a gate trusts is opened</text>
<rect class="b-cmp" x="32" y="724" width="300" height="150" rx="10"/>
<text class="t-code" x="48" y="752">admit_a_room_message</text>
<text class="t-type" x="48" y="770">[loaded; the room is not built]</text>
<text class="t-desc" x="48" y="794">Every launch loads these, though the room</text>
<text class="t-desc" x="48" y="810">they serve is not built: the node id a</text>
<text class="t-desc" x="48" y="826">member has; read_a_room_through_its_gate</text>
<text class="t-desc" x="48" y="842">gives the mesh server's tools, and refuse_</text>
<text class="t-desc" x="48" y="858">widening_a_member_reach refuses the rest</text>
<rect class="b-cmp" x="348" y="724" width="300" height="150" rx="10"/>
<text class="t-code" x="364" y="752">claude_code_host, claude_code_relay</text>
<text class="t-type" x="364" y="770">[the Claude Code host]</text>
<text class="t-desc" x="364" y="794">The host contract on Claude Code: the</text>
<text class="t-desc" x="364" y="810">plugin, its hooks, the relay on a socket</text>
<text class="t-desc" x="364" y="826">and the member's tools; refuse_a_member_</text>
<text class="t-desc" x="364" y="842">writing_owner_memory keeps a member's</text>
<text class="t-desc" x="364" y="858">writes out of the owner's memory</text>
<rect class="b-cmp" x="664" y="724" width="300" height="150" rx="10"/>
<text class="t-code" x="680" y="752">check_nothing_private_gets_in</text>
<text class="t-type" x="680" y="770">[this repository's own check]</text>
<text class="t-desc" x="680" y="794">A link to a private issue, an internal</text>
<text class="t-desc" x="680" y="810">host name or a private remote fails CI</text>
<text class="t-desc" x="680" y="826">by name, with a self-test that proves</text>
<text class="t-desc" x="680" y="842">the check still bites</text>
<text class="t-desc" x="24" y="908">Every box is a directory in src/: the name is the capability, and its test sits beside it. Three directories are drawn nowhere on purpose:</text>
<text class="t-desc" x="24" y="926">log_ledger, the crew ledger, which nothing this release runs loads yet; and the two scripts run by hand when a host is recorded,</text>
<text class="t-desc" x="24" y="944">probe_launch_hosts and record_claude_code_host. record_mesh_server_tools is drawn because the launcher imports what it recorded; the</text>
<text class="t-desc" x="24" y="962">room itself is not built, and solo admits nothing, though every launch loads the node id, the tool list and the gates its slices hold.</text>
<rect class="b-sys" x="24" y="984" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="996">Martha</text>
<rect class="b-cmp" x="103.6" y="984" width="22" height="14" rx="3"/>
<text class="t-leg" x="133.6" y="996">Container or component</text>
<rect class="b-dat" x="288.79999999999995" y="984" width="22" height="14" rx="3"/>
<text class="t-leg" x="318.79999999999995" y="996">Data, in the project</text>
<rect class="bound" x="460.79999999999995" y="984" width="22" height="14" rx="3"/>
<text class="t-leg" x="490.79999999999995" y="996">Boundary</text>
</svg>
