<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" role="img" aria-label="Martha components">
<title>Martha components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-team { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #A56F0A; stroke-width: 1.25; }
.b-dat { fill: #FBF6EA; stroke: #A56F0A; stroke-width: 1.25; }
.b-team { fill: #FFFFFF; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-later { fill: #F3F4F3; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-team { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #E3AA3C; }
.b-dat { fill: #2A2414; stroke: #E3AA3C; }
.b-team { fill: #171F1C; stroke: #A9A4C8; }
.b-later { fill: #1C2421; stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-team { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="940"/>
<rect class="bound" x="16" y="40" width="968" height="776" rx="12"/>
<text class="t-bound" x="32" y="62">Martha [the code in src/, one directory per capability]</text>
<rect class="b-sys" x="32" y="70" width="300" height="128" rx="10"/>
<text class="t-code" x="48" y="98">run_the_martha_command</text>
<text class="t-type" x="48" y="116">[the four acts]</text>
<text class="t-desc" x="48" y="140">init, approve, start &lt;member&gt;, --version:</text>
<text class="t-desc" x="48" y="156">the words checked before anything runs,</text>
<text class="t-desc" x="48" y="172">a refusal on stderr with the command that</text>
<text class="t-desc" x="48" y="188">fixes it, 0 done / 1 refused / 2 usage</text>
<rect class="b-cmp" x="348" y="70" width="300" height="128" rx="10"/>
<text class="t-code" x="364" y="98">declare_a_solo_crew, declare_crew</text>
<text class="t-type" x="364" y="116">[the declaration]</text>
<text class="t-desc" x="364" y="140">Reads .crew/crew.json once into typed</text>
<text class="t-desc" x="364" y="156">settings; writes it only when none exists.</text>
<text class="t-desc" x="364" y="172">who_may_act holds the mode's table of</text>
<text class="t-desc" x="364" y="188">who may assign, approve and resume</text>
<rect class="b-cmp" x="664" y="70" width="300" height="128" rx="10"/>
<text class="t-code" x="680" y="98">approve_a_checkouts_config</text>
<text class="t-type" x="680" y="116">[the owner's yes]</text>
<text class="t-desc" x="680" y="140">Names every file that starts code and</text>
<text class="t-desc" x="680" y="156">the checkout's tree, asks on the owner's</text>
<text class="t-desc" x="680" y="172">own terminal, and keeps the fingerprint</text>
<text class="t-desc" x="680" y="188">it was given in approvals.jsonl</text>
<rect class="b-cmp" x="32" y="214" width="300" height="128" rx="10"/>
<text class="t-code" x="48" y="242">start_a_member</text>
<text class="t-type" x="48" y="260">[one member]</text>
<text class="t-desc" x="48" y="284">Refuses no terminal, a switch it does</text>
<text class="t-desc" x="48" y="300">not pass, a name the crew lacks, and a</text>
<text class="t-desc" x="48" y="316">stale approval, then names the approval</text>
<text class="t-desc" x="48" y="332">it starts on and holds the terminal</text>
<rect class="b-cmp" x="348" y="214" width="300" height="128" rx="10"/>
<text class="t-code" x="364" y="242">launch_a_claude_code_member</text>
<text class="t-type" x="364" y="260">[the launcher]</text>
<text class="t-desc" x="364" y="284">The places in Martha's state, a</text>
<text class="t-desc" x="364" y="300">snapshot of what was approved, a launch</text>
<text class="t-desc" x="364" y="316">record written before the host starts,</text>
<text class="t-desc" x="364" y="332">and the host's command and arguments</text>
<rect class="b-cmp" x="664" y="214" width="300" height="128" rx="10"/>
<text class="t-code" x="680" y="242">refuse_launch_of_unapproved_config</text>
<text class="t-type" x="680" y="260">[the launch gate]</text>
<text class="t-desc" x="680" y="284">Fingerprints the config and the tree</text>
<text class="t-desc" x="680" y="300">id at start, and allows only what was</text>
<text class="t-desc" x="680" y="316">approved; refuse_code_a_checkout_runs_</text>
<text class="t-desc" x="680" y="332">itself closes a checkout's own scripts</text>
<rect class="b-dat" x="32" y="358" width="300" height="150" rx="10"/>
<text class="t-code" x="48" y="386">keep_martha_state_</text>
<text class="t-code" x="48" y="404">outside_the_checkout</text>
<text class="t-type" x="48" y="422">[Martha's state]</text>
<text class="t-desc" x="48" y="446">One directory per project, named by a</text>
<text class="t-desc" x="48" y="462">hash of its path: node ids, approvals,</text>
<text class="t-desc" x="48" y="478">launches, snapshots. row_streams_</text>
<text class="t-desc" x="48" y="494">directory appends rows as files</text>
<rect class="b-cmp" x="348" y="358" width="300" height="128" rx="10"/>
<text class="t-code" x="364" y="386">linux_process_identity</text>
<text class="t-type" x="364" y="404">[this machine]</text>
<text class="t-desc" x="364" y="428">The files and scratch directories on</text>
<text class="t-desc" x="364" y="444">this machine's disk, and the processes</text>
<text class="t-desc" x="364" y="460">run on it: what the host contract asks</text>
<text class="t-desc" x="364" y="476">for, answered without a host</text>
<rect class="b-cmp" x="664" y="358" width="300" height="128" rx="10"/>
<text class="t-code" x="680" y="386">install_the_recorded_mesh_server</text>
<text class="t-type" x="680" y="404">[recorded trees]</text>
<text class="t-desc" x="680" y="428">A tree by bytes, never by version:</text>
<text class="t-desc" x="680" y="444">record_mesh_server_tools records it,</text>
<text class="t-desc" x="680" y="460">prove_the_mesh_server_bytes compares it</text>
<text class="t-desc" x="680" y="476">again, and the launcher installs it</text>
<rect class="b-cmp" x="32" y="524" width="300" height="128" rx="10"/>
<text class="t-code" x="48" y="552">inbound_paths</text>
<text class="t-type" x="48" y="570">[every path, and its control]</text>
<text class="t-desc" x="48" y="594">Every way text reaches a session and</text>
<text class="t-desc" x="48" y="610">every way a checkout starts code, each</text>
<text class="t-desc" x="48" y="626">row naming the gate on it; check_every_</text>
<text class="t-desc" x="48" y="642">path_is_gated fails CI on a gap</text>
<rect class="b-cmp" x="348" y="524" width="300" height="128" rx="10"/>
<text class="t-code" x="364" y="552">take_in_a_turn, shell_tools</text>
<text class="t-type" x="364" y="570">[the shell gate]</text>
<text class="t-desc" x="364" y="594">What a host calls when a session took</text>
<text class="t-desc" x="364" y="610">something in, and what may run after;</text>
<text class="t-desc" x="364" y="626">refuse_execution_after_ungated_text</text>
<text class="t-desc" x="364" y="642">stops everything after unvetted text</text>
<rect class="b-cmp" x="664" y="524" width="300" height="128" rx="10"/>
<text class="t-code" x="680" y="552">name_the_source_of_a_prompt</text>
<text class="t-type" x="680" y="570">[whose text it was]</text>
<text class="t-desc" x="680" y="594">The origin a host attests, carried</text>
<text class="t-desc" x="680" y="610">with the turn: attribute_a_cross_</text>
<text class="t-desc" x="680" y="626">session_sender, carry_taint_across_a_</text>
<text class="t-desc" x="680" y="642">refresh, and the shell gate's reading of it</text>
<rect class="b-team" x="32" y="668" width="300" height="140" rx="10"/>
<text class="t-code" x="48" y="696">admit_a_room_message</text>
<text class="t-type" x="48" y="714">[the rooms, team mode]</text>
<text class="t-desc" x="48" y="738">Whether a crew or shared room message</text>
<text class="t-desc" x="48" y="754">is admitted; read_a_room_through_its_</text>
<text class="t-desc" x="48" y="770">gate for the mesh side, trust_only_</text>
<text class="t-desc" x="48" y="786">framed_envelopes for what is believed</text>
<rect class="b-cmp" x="348" y="668" width="300" height="140" rx="10"/>
<text class="t-code" x="364" y="696">claude_code_host, claude_code_relay</text>
<text class="t-type" x="364" y="714">[the Claude Code host]</text>
<text class="t-desc" x="364" y="738">The host contract on Claude Code: the</text>
<text class="t-desc" x="364" y="754">plugin and its hooks, the relay that</text>
<text class="t-desc" x="364" y="770">answers over a socket, and the tools</text>
<text class="t-desc" x="364" y="786">registered in the member's session</text>
<rect class="b-cmp" x="664" y="668" width="300" height="140" rx="10"/>
<text class="t-code" x="680" y="696">check_nothing_private_gets_in</text>
<text class="t-type" x="680" y="714">[this repository's own check]</text>
<text class="t-desc" x="680" y="738">A link to a private issue, an internal</text>
<text class="t-desc" x="680" y="754">host name or a private remote fails CI</text>
<text class="t-desc" x="680" y="770">by name, with a self-test that proves</text>
<text class="t-desc" x="680" y="786">the check still bites</text>
<text class="t-desc" x="24" y="852">Every box is a directory in src/: the name is the capability, and its test sits beside it. The command reads the declaration,</text>
<text class="t-desc" x="24" y="870">the approval and the gate before it starts anything; the relay is the only part that runs inside the member's session, and the</text>
<text class="t-desc" x="24" y="888">only part that sees a turn. The room boxes are team mode: this release ships solo, and loads none of them.</text>
<rect class="b-sys" x="24" y="906" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="918">Martha</text>
<rect class="b-cmp" x="103.6" y="906" width="22" height="14" rx="3"/>
<text class="t-leg" x="133.6" y="918">Container or component</text>
<rect class="b-dat" x="288.79999999999995" y="906" width="22" height="14" rx="3"/>
<text class="t-leg" x="318.79999999999995" y="918">Data, in the project</text>
<rect class="b-team" x="460.79999999999995" y="906" width="22" height="14" rx="3"/>
<text class="t-leg" x="490.79999999999995" y="918">Container, team mode only</text>
<rect class="bound" x="665.8" y="906" width="22" height="14" rx="3"/>
<text class="t-leg" x="695.8" y="918">Boundary</text>
</svg>
