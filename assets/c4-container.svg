<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-label="Martha containers">
<title>Martha containers</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-team { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #A56F0A; stroke-width: 1.25; }
.b-dat { fill: #FBF6EA; stroke: #A56F0A; stroke-width: 1.25; }
.b-team { fill: #FFFFFF; stroke: #5E5A78; stroke-width: 1.25; stroke-dasharray: 5 4; }
.b-later { fill: #F3F4F3; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-team { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #E3AA3C; }
.b-dat { fill: #2A2414; stroke: #E3AA3C; }
.b-team { fill: #171F1C; stroke: #A9A4C8; }
.b-later { fill: #1C2421; stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-team { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1120" height="780"/>
<rect class="bound" x="16" y="40" width="600" height="660" rx="12"/>
<text class="t-bound" x="32" y="688">Martha [the package, on the owner's machine]</text>
<rect class="b-cmp" x="32" y="76" width="268" height="150" rx="10"/>
<text class="t-code" x="48" y="104">the martha command</text>
<text class="t-type" x="48" y="122">[bin/martha, a Node process]</text>
<text class="t-desc" x="48" y="146">init, approve, start &lt;member&gt;,</text>
<text class="t-desc" x="48" y="162">--version. Reads the declaration and</text>
<text class="t-desc" x="48" y="178">the approval, then starts one member</text>
<text class="t-desc" x="48" y="194">and holds its terminal</text>
<rect class="b-dat" x="32" y="246" width="268" height="120" rx="10"/>
<text class="t-name" x="48" y="274">Martha's state</text>
<text class="t-type" x="48" y="292">[~/.local/state/martha]</text>
<text class="t-desc" x="48" y="316">Per project, outside the checkout:</text>
<text class="t-desc" x="48" y="332">each member's node id, the approvals</text>
<text class="t-desc" x="48" y="348">given, launch records and snapshots</text>
<rect class="b-later" x="32" y="546" width="268" height="132" rx="10"/>
<text class="t-name" x="48" y="574">the team mode</text>
<text class="t-type" x="48" y="592">[planned]</text>
<text class="t-desc" x="48" y="616">Realm admission and the shared room,</text>
<text class="t-desc" x="48" y="632">not built here; solo admits nothing.</text>
<text class="t-desc" x="48" y="648">The parts every launch loads are</text>
<text class="t-desc" x="48" y="664">drawn below</text>
<rect class="b-dat" x="332" y="76" width="268" height="120" rx="10"/>
<text class="t-name" x="348" y="104">the crew declaration</text>
<text class="t-type" x="348" y="122">[.crew/crew.json]</text>
<text class="t-desc" x="348" y="146">Who is on the crew, and the mode's</text>
<text class="t-desc" x="348" y="162">table of who may do what; written</text>
<text class="t-desc" x="348" y="178">once by init, never written over</text>
<rect class="b-cmp" x="332" y="216" width="268" height="140" rx="10"/>
<text class="t-code" x="348" y="244">the approval</text>
<text class="t-type" x="348" y="262">[approve_a_checkouts_config]</text>
<text class="t-desc" x="348" y="286">Shows every file that would start code</text>
<text class="t-desc" x="348" y="302">and the checkout's tree, then takes one</text>
<text class="t-desc" x="348" y="318">word: yes. Its fingerprint covers the</text>
<text class="t-desc" x="348" y="334">files and the tree</text>
<rect class="b-cmp" x="332" y="376" width="268" height="140" rx="10"/>
<text class="t-code" x="348" y="404">the launcher</text>
<text class="t-type" x="348" y="422">[launch_a_claude_code_member]</text>
<text class="t-desc" x="348" y="446">Snapshots approved config, writes a</text>
<text class="t-desc" x="348" y="462">launch record before the host starts,</text>
<text class="t-desc" x="348" y="478">and runs the host with the arguments</text>
<text class="t-desc" x="348" y="494">the crew's member may pass</text>
<rect class="b-cmp" x="332" y="546" width="268" height="120" rx="10"/>
<text class="t-code" x="348" y="574">the relay</text>
<text class="t-type" x="348" y="592">[claude_code_relay, a plugin]</text>
<text class="t-desc" x="348" y="616">Loads in the member's session and</text>
<text class="t-desc" x="348" y="632">gates its turns: what it may run, and</text>
<text class="t-desc" x="348" y="648">whose text it took in</text>
<rect class="b-ext" x="800" y="76" width="296" height="96" rx="10"/>
<text class="t-name" x="816" y="104">A terminal</text>
<text class="t-type" x="816" y="122">[External system]</text>
<text class="t-desc" x="816" y="146">One per member: start holds it</text>
<rect class="b-ext" x="800" y="196" width="296" height="96" rx="10"/>
<text class="t-name" x="816" y="224">Claude Code</text>
<text class="t-type" x="816" y="242">[External: coding tool]</text>
<text class="t-desc" x="816" y="266">The session a member is</text>
<rect class="b-ext" x="800" y="316" width="296" height="96" rx="10"/>
<text class="t-name" x="816" y="344">git and the checkout</text>
<text class="t-type" x="816" y="362">[External systems]</text>
<text class="t-desc" x="816" y="386">The tree id, and the member's work</text>
<rect class="b-ext" x="800" y="436" width="296" height="96" rx="10"/>
<text class="t-name" x="816" y="464">The mesh server</text>
<text class="t-type" x="816" y="482">[External: a published package]</text>
<text class="t-desc" x="816" y="506">Installed from its recorded tree</text>
<path class="edge" d="M166 226V246" marker-end="url(#a)"/>
<text class="t-rel" x="174" y="242">node id, approvals</text>
<path class="edge" d="M300 136H332" marker-end="url(#a)"/>
<text class="t-rel" x="316" y="128" text-anchor="middle">init writes it</text>
<path class="edge" d="M300 200H320V286H332" marker-end="url(#a)"/>
<text class="t-rel" x="326" y="240" text-anchor="middle" transform="rotate(90 326 240)">approve</text>
<path class="edge" d="M300 214H308V446H332" marker-end="url(#a)"/>
<text class="t-rel" x="314" y="380" text-anchor="middle" transform="rotate(90 314 380)">start</text>
<path class="edge" d="M166 76V48H660V172H800" marker-end="url(#a)"/>
<text class="t-rel" x="640" y="110" text-anchor="middle" transform="rotate(90 640 110)">a member's terminal</text>
<path class="edge" d="M600 286H700V364H800" marker-end="url(#a)"/>
<text class="t-rel" x="686" y="330" text-anchor="middle" transform="rotate(90 686 330)">the tree id</text>
<path class="edge" d="M600 446H660V292H800" marker-end="url(#a)"/>
<text class="t-rel" x="646" y="400" text-anchor="middle" transform="rotate(90 646 400)">runs the host</text>
<path class="edge" d="M800 250H730V606H600" marker-end="url(#a)"/>
<text class="t-rel" x="716" y="540" text-anchor="middle" transform="rotate(90 716 540)">loads the relay</text>
<path class="edge" d="M600 490H800" marker-end="url(#a)"/>
<text class="t-rel" x="660" y="483" text-anchor="middle">installs it</text>
<text class="t-desc" x="24" y="728">The launch gate is not a box of its own here: it is the check inside start, drawn as a component one level down. Martha reaches</text>
<text class="t-desc" x="24" y="746">no service: state is files under the owner's own home, and what is outside is the coding tool, a terminal, git, and a mesh server only</text>
<text class="t-desc" x="24" y="764">when the project's config names one.</text>
</svg>
